                  - link "§7.4" [ref=f4e274] [cursor=pointer]:
                    - /url: /articles/personal-finance-india/epf-eps-form-11
                  - text: )
              - row [ref=f4e275]:
                - cell "Whichever tax regime payroll assumes for you" [ref=f4e276]
                - cell [ref=f4e277]:
                  - text: The one that actually wins at
                  - emphasis [ref=f4e278]: your
                  - text: deduction level, computed rather than guessed (
                  - link "§4.6" [ref=f4e279] [cursor=pointer]:
                    - /url: /articles/personal-finance-india/tax-regimes
                  - text: )
              - row [ref=f4e280]:
                - cell "Old PF sitting dormant under a previous Member ID" [ref=f4e281]
                - cell [ref=f4e282]:
                  - text: A transfer that keeps the 5-year and 10-year clocks running (
                  - link "§7.4" [ref=f4e283] [cursor=pointer]:
                    - /url: /articles/personal-finance-india/epf-eps-form-11
                  - text: )
          - paragraph [ref=f4e284]:
            - text: The one-time setup checklist (every portal, form and account worth opening once) is at
            - link "§16" [ref=f4e285] [cursor=pointer]:
              - /url: /articles/personal-finance-india/forms-and-links
            - text: .
          - separator [ref=f4e286]
          - heading "What this is not" [level=2] [ref=f4e287]
          - paragraph [ref=f4e288]:
            - text: This document states
            - strong [ref=f4e289]: how things work
            - text: . It does not tell you what to do.
          - paragraph [ref=f4e290]: "There are no recommended allocations here, no \"best\" funds, no verdict on whether you should rent or buy. Those answers depend on facts a document cannot know: what you pay in rent, whether your parents depend on your income, how secure your team is, whether there is a wedding in two years, whether you have the stomach to keep a SIP running through a 30% drawdown."
          - paragraph [ref=f4e291]:
            - text: "What it gives you instead is the raw material for that judgement: the thresholds, the formulas, the section numbers, the deadlines, and the trade-offs stated in"
            - strong [ref=f4e292]: both
            - text: directions, so you can weigh them against circumstances only you know. The ₹86,400 above is a real number; whether the locked-until-retirement account it lands in is the right place for your next ₹86,400 is a question about you, not about the EPF Act. This supplies the constraints. You supply the circumstances.
          - paragraph [ref=f4e293]: Where a widely-repeated belief is factually wrong, this document says so and states the actual rule. There are several such cases, and two of them concern your provident fund.
          - separator [ref=f4e294]
          - heading "Why this year is different" [level=2] [ref=f4e295]
          - paragraph [ref=f4e296]: If you have read anything about Indian personal finance written before April 2026, a meaningful fraction of it is now citing dead law.
          - table [ref=f4e298]:
            - rowgroup [ref=f4e299]:
              - row [ref=f4e300]:
                - columnheader "What changed" [ref=f4e301]
                - columnheader "When" [ref=f4e302]
                - columnheader "Effect" [ref=f4e303]
            - rowgroup [ref=f4e304]:
              - row [ref=f4e305]:
                - cell [ref=f4e306]:
                  - strong [ref=f4e307]: Income-tax Act, 2025
                  - text: replaced the Income-tax Act, 1961
                - cell "1 April 2026" [ref=f4e308]
                - cell "819 sections became 536. Section numbers changed throughout." [ref=f4e309]
              - row [ref=f4e310]:
                - cell [ref=f4e311]:
                  - strong [ref=f4e312]: "\"Tax Year\""
                  - text: replaced "Previous Year" and "Assessment Year"
                - cell "1 April 2026" [ref=f4e313]
                - cell "One term instead of two. FY 2026-27 is simply Tax Year 2026-27." [ref=f4e314]
              - row [ref=f4e315]:
                - cell [ref=f4e316]:
                  - strong [ref=f4e317]: Form numbers changed
                - cell "FY 2026-27 onward" [ref=f4e318]
                - cell [ref=f4e319]:
                  - text: Form 16 →
                  - strong [ref=f4e320]: Form 130
                  - text: . Form 26AS →
                  - strong [ref=f4e321]: Form 168
                  - text: . Form 12BB →
                  - strong [ref=f4e322]: Form 124
                  - text: . Form 15G/15H →
                  - strong [ref=f4e323]: Form 121
                  - text: .
              - row [ref=f4e324]:
                - cell [ref=f4e325]:
                  - strong [ref=f4e326]: Four Labour Codes came into force
                - cell "21 November 2025" [ref=f4e327]
                - cell "Basic + DA must be ≥ 50% of remuneration. This changes your payslip." [ref=f4e328]
              - row [ref=f4e329]:
                - cell [ref=f4e330]:
                  - strong [ref=f4e331]: Perquisite limits raised
                  - text: after decades frozen
                - cell "FY 2026-27" [ref=f4e332]
                - cell "Meal vouchers ₹50 → ₹200/meal. Gift vouchers ₹5,000 → ₹15,000/yr." [ref=f4e333]
              - row [ref=f4e334]:
                - cell [ref=f4e335]:
                  - strong [ref=f4e336]: GST on individual life & health insurance
                  - text: cut to zero
                - cell "22 September 2025" [ref=f4e337]
                - cell "Individual policies 18% → 0%. Group policies still 18%." [ref=f4e338]
              - row [ref=f4e339]:
                - cell [ref=f4e340]:
                  - strong [ref=f4e341]: NPS exit rules amended
                - cell "16 December 2025" [ref=f4e342]
                - cell "Lump sum at exit raised from 60% to 80%, but the tax law has not caught up." [ref=f4e343]
          - paragraph [ref=f4e344]:
            - text: Section numbers in this document are given in the form
            - strong [ref=f4e345]: "\"Section 123 (formerly 80C)\""
            - text: so that you can match both the new law and any older material you encounter. Note that your Form 16 for FY 2025-26 (the one you used to file in July 2026) still carries the
            - emphasis [ref=f4e346]: old
            - text: numbers. The new numbering first appears on Form 130 for FY 2026-27.
          - separator [ref=f4e347]
          - heading "Where you actually stand" [level=2] [ref=f4e348]
          - paragraph [ref=f4e349]: Before any of the mechanics, one piece of context, because engineers systematically misjudge it.
          - paragraph [ref=f4e350]:
            - text: According to the
            - strong [ref=f4e351]: World Inequality Report 2026
            - text: ", published by the World Inequality Lab:"
          - list [ref=f4e352]:
            - listitem [ref=f4e353]:
              - text: India's
              - strong [ref=f4e354]: top 1%
              - text: holds roughly
              - strong [ref=f4e355]: 40%
              - text: of national wealth.
            - listitem [ref=f4e356]:
              - text: The
              - strong [ref=f4e357]: top 10%
              - text: holds roughly
              - strong [ref=f4e358]: 65%
              - text: of national wealth, and receives about
              - strong [ref=f4e359]: 58%
              - text: of national income.
            - listitem [ref=f4e360]:
              - text: The
              - strong [ref=f4e361]: bottom 50%
              - text: receives about
              - strong [ref=f4e362]: 15%
              - text: of national income.
            - listitem [ref=f4e363]:
              - text: Average income per adult is roughly
              - strong [ref=f4e364]: ₹6.5 lakh per year
              - text: and average wealth roughly
              - strong [ref=f4e365]: ₹29.4 lakh
              - text: ", both measured at purchasing power parity, and both are"
              - emphasis [ref=f4e366]: averages
              - text: ", which in a distribution this skewed sit far above the median."
          - paragraph [ref=f4e367]:
            - text: Set against that, entry-level engineering compensation in India in 2026 spans roughly
            - strong [ref=f4e368]: ₹3.5–6 lakh
            - text: at large IT services firms,
            - strong [ref=f4e369]: ₹8–15 lakh
            - text: at mid-tier product companies, and
            - strong [ref=f4e370]: ₹15–35 lakh
            - text: at global capability centres and top-tier product companies. The spread between the bottom quartile and top quartile of campus offers is close to eightfold.
          - paragraph [ref=f4e371]: "Two consequences follow, and they pull in opposite directions:"
          - list [ref=f4e372]:
            - listitem [ref=f4e373]:
              - strong [ref=f4e374]: A salaried engineering job in India places you far up the national income distribution very early.
              - text: The decisions you make in your twenties therefore involve real sums, and errors compound for forty years.
            - listitem [ref=f4e375]:
              - strong [ref=f4e376]: Your peer group is not the population.
              - text: If you calibrate spending against colleagues, you are calibrating against roughly the top 1–2% of the country. That is a legitimate choice; it is not a neutral one, and it is worth knowing you are making it.
          - paragraph [ref=f4e377]: This point is sharper in India than almost anywhere else, because the Indian distribution is considerably more unequal than the ones such comparisons are usually drawn from.
          - separator [ref=f4e378]
          - heading "A note on accuracy and expiry" [level=2] [ref=f4e379]
          - paragraph [ref=f4e380]:
            - text: Every figure here was verified against public sources in
            - strong [ref=f4e381]: August 2026
            - text: ". Indian tax and pension rules change at least annually: Union Budget in February, small-savings rates quarterly, EPF interest rate around March, and, this year, an entirely new tax statute."
          - paragraph [ref=f4e382]:
            - text: Three things are
            - strong [ref=f4e383]: actively in flux
            - text: "as of August 2026 and are flagged wherever they appear:"
          - list [ref=f4e384]:
            - listitem [ref=f4e385]:
              - text: The
              - strong [ref=f4e386]: EPF wage ceiling
              - text: (₹15,000 since 2014) is under revision. The Supreme Court directed a decision within four months in January 2026; reporting suggests ₹25,000 with an effective date around April 2027. Not yet notified.
            - listitem [ref=f4e387]:
              - strong [ref=f4e388]: EPS-95 higher pension
              - text: implementation continues to generate litigation and administrative revision following the Supreme Court judgment of 4 November 2022.
            - listitem [ref=f4e389]:
              - strong [ref=f4e390]: NPS exit
              - text: now permits an 80% lump sum under PFRDA regulations, while the income-tax exemption still covers only 60%. The two have not been reconciled.
          - paragraph [ref=f4e391]: Do not treat any number here as current beyond the next Union Budget without re-checking it.
