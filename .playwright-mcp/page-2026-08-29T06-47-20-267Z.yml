          - paragraph [ref=f4e208]:
            - text: None of this is about earning more, picking better stocks, or working harder. Not one row rewards effort. Each rewards
            - strong [ref=f4e209]: knowing that a second branch exists
            - text: ", at the one moment the branch is available."
          - generic [ref=f4e211]:
            - heading "The Cost of Delayed Investing" [level=3] [ref=f4e212]
            - generic [ref=f4e213]:
              - generic [ref=f4e214]:
                - generic [ref=f4e215]: "Monthly Contribution: ₹10,000"
                - slider [ref=f4e216]: "10000"
              - generic [ref=f4e217]:
