        - generic [ref=f4e26]:
          - heading "Personal Finance for Engineers in India" [level=1] [ref=f4e27]
          - paragraph [ref=f4e28]:
            - emphasis [ref=f4e29]:
              - text: A structured reference, current as of
              - strong [ref=f4e30]: 12 August 2026
              - text: (Financial Year 2026-27, the first year under the new
              - strong [ref=f4e31]: Income-tax Act, 2025
              - text: ).
          - separator [ref=f4e32]
          - heading "What this is, and why it exists" [level=2] [ref=f4e33]
          - paragraph [ref=f4e34]: "A structured reference on money for salaried engineers in India: how compensation, tax, provident fund, pension, insurance, credit and investing actually work, stated as rules and numbers rather than opinions."
          - paragraph [ref=f4e35]: It exists because Indian engineering education produces excellent engineers and says nothing about what happens after the offer letter. At 21 or 22 you are handed the largest sum of money you have ever controlled, along with a payslip carrying a dozen line items nobody explains. The first real decisions (tax regime, PF, insurance, where the monthly investment goes) all fall due inside your first ninety days, which is precisely when you know least about them.
          - paragraph [ref=f4e36]:
            - text: None of this is secret. It is badly
            - emphasis [ref=f4e37]: distributed
            - text: . It sits in EPFO circulars, gazette notifications, SEBI regulations and PFRDA amendments, and everywhere else it has been rewritten into blog posts that contradict one another and mostly predate the current statute. Nobody in the chain has the job of telling you, either. HR administers policy rather than advising on it; banks, distributors and agents are sellers and are paid as sellers; your parents' instincts were formed around different instruments, a different inflation rate and a different tax code.
          - paragraph [ref=f4e38]: So the aim is narrow. Collect the actual rules in one place, in the order an engineer meets them, with the arithmetic worked rather than asserted, and keep it short enough to read in an afternoon.
          - paragraph [ref=f4e39]:
            - text: The
            - emphasis [ref=f4e40]: principles
            - text: of personal finance are universal; compounding does not care which passport you hold. The
            - emphasis [ref=f4e41]: instruments
            - text: are not. A 401(k) is not an EPF account. A Roth IRA has no Indian equivalent at all. FICO is not CIBIL. The US mortgage-interest deduction works nothing like Section 24(b), which was itself renumbered to Section 22 four months ago. This book keeps the universal skeleton and rebuilds every organ around Indian law.
          - paragraph [ref=f4e42]:
            - strong [ref=f4e43]: "Who it is for:"
            - text: salaried engineers in India. It is most valuable in the first few years, when the decisions are cheapest to get right, though the reference chapters apply at any stage. If you are self-employed, on a foreign payroll, or an NRI, the principles hold but several of the specific rules do not.
          - paragraph [ref=f4e44]:
            - strong [ref=f4e45]: "Attribution:"
            - text: the conceptual framing, topic ordering and several analytical devices derive from
            - emphasis [ref=f4e46]: Personal Finance for Engineers
            - text: (CS 007) by Adam Nash & Stanford University, published for non-commercial use at
            - link "cs007.blog" [ref=f4e47] [cursor=pointer]:
              - /url: http://cs007.blog
            - text: .
          - separator [ref=f4e48]
          - heading "Contents" [level=2] [ref=f4e49]
          - paragraph [ref=f4e50]: Sixteen chapters, a calculator and two reference pages, ordered the way an Indian engineer actually encounters these things, not the way a textbook organises them.
          - 'heading "Part I: The ground rules" [level=3] [ref=f4e51]'
          - paragraph [ref=f4e52]:
            - strong [ref=f4e53]:
              - link "1. First principles" [ref=f4e54] [cursor=pointer]:
                - /url: /articles/personal-finance-india/first-principles
            - text: Compounding, the Rule of 72, APR versus APY, savings rate, liquidity, the personal balance sheet and income statement, and the cognitive biases that reliably defeat all of the above.
          - 'heading "Part II: Getting paid" [level=3] [ref=f4e55]'
          - paragraph [ref=f4e56]:
            - strong [ref=f4e57]:
              - link "2. Decoding an Indian offer letter" [ref=f4e58] [cursor=pointer]:
                - /url: /articles/personal-finance-india/offer-letter
            - text: CTC versus gross versus in-hand. Every component and which ones are real cash. The Labour Codes' 50%-basic rule and what it did to your take-home. Joining bonuses, clawbacks, notice periods, and what is actually negotiable.
          - paragraph [ref=f4e59]:
            - strong [ref=f4e60]:
              - link "3. Equity compensation" [ref=f4e61] [cursor=pointer]:
                - /url: /articles/personal-finance-india/equity-compensation
            - text: ESOPs, RSUs, ESPPs. The two-point taxation model. Foreign parent shares and Schedule FA. The deferral available to employees of eligible DPIIT-recognised start-ups. What happens to unvested equity when you leave.
          - 'heading "Part III: Tax" [level=3] [ref=f4e62]'
          - paragraph [ref=f4e63]:
            - strong [ref=f4e64]:
              - link "4. Old regime vs new regime, FY 2026-27" [ref=f4e65] [cursor=pointer]:
                - /url: /articles/personal-finance-india/tax-regimes
            - text: Both slab tables, the ₹60,000 rebate, marginal relief, surcharge, cess. The break-even calculation done from first principles. The Income-tax Act 2025 renumbering map.
          - paragraph [ref=f4e66]:
            - strong [ref=f4e67]:
              - link "5. Salary structuring, allowances and perquisites" [ref=f4e68] [cursor=pointer]:
                - /url: /articles/personal-finance-india/salary-structuring
            - text: HRA, LTA, relocation, company cab, meal cards, telephone and internet, children's education and hostel allowance, gift vouchers, uniform, books. The raised FY 2026-27 limits. Which of these survive in the new regime, and which do not.
          - paragraph [ref=f4e69]:
            - strong [ref=f4e70]:
              - 'link "6. Worked example: ₹18 lakh CTC, end to end" [ref=f4e71] [cursor=pointer]':
                - /url: /articles/personal-finance-india/worked-example
            - text: One salary, structured under the Labour Codes, taxed under both regimes, reduced to a monthly in-hand figure with every deduction shown.
          - paragraph [ref=f4e72]:
            - strong [ref=f4e73]:
              - link "Salary calculators" [ref=f4e74] [cursor=pointer]:
                - /url: /articles/personal-finance-india/calculator
            - text: "The same arithmetic, run on your numbers: CTC to in-hand under both regimes, the break-even deduction total, an EPF projection and gratuity."
          - generic [ref=f4e75]:
            - heading "Tax Regime Break-even Explorer" [level=3] [ref=f4e76]
            - paragraph [ref=f4e77]: FY 2026-27 slabs. Standard deduction is applied for you — ₹75,000 in the new regime, ₹50,000 in the old.
            - generic [ref=f4e78]:
              - generic [ref=f4e79]:
                - generic [ref=f4e80]: "Gross salary (annual): ₹15.0L"
                - 'slider "Gross salary (annual): ₹15.0L" [ref=f4e81]': "1500000"
              - generic [ref=f4e82]:
                - generic [ref=f4e83]: "Old-regime deductions (80C, HRA, 80D…): ₹2.0L"
                - 'slider "Old-regime deductions (80C, HRA, 80D…): ₹2.0L" [ref=f4e84]': "200000"
            - generic [ref=f4e87]:
              - paragraph [ref=f4e88]:
                - text: At ₹15.0L gross with ₹2.0L of declared deductions, the
                - strong [ref=f4e89]: new regime
                - text: saves you
                - generic [ref=f4e90]: ₹97,500
                - text: in tax.
              - paragraph [ref=f4e91]: The old regime only catches up past roughly ₹5,44,000 of declared deductions at this salary.
          - 'heading "Part IV: The mandatory savings layer" [level=3] [ref=f4e92]'
          - paragraph [ref=f4e93]:
            - strong [ref=f4e94]:
              - link "7. EPF, EPS, Form 11, VPF and gratuity" [ref=f4e95] [cursor=pointer]:
                - /url: /articles/personal-finance-india/epf-eps-form-11
            - text: "The full mechanics of provident fund. What Form 11 actually does, and what it does not. The Para 26(6) joint declaration: the real mechanism for contributing above the wage ceiling. Why VPF is never matched. Taxation of PF interest above ₹2.5 lakh. The five-year rule. EPS pension arithmetic."
          - paragraph [ref=f4e96]:
            - strong [ref=f4e97]:
              - link "8. NPS" [ref=f4e98] [cursor=pointer]:
                - /url: /articles/personal-finance-india/nps
            - text: Tier I and Tier II. Asset classes E, C, G and A. Auto versus active choice. The three deduction sections and which survive in the new regime. The December 2025 exit amendment and the tax mismatch it created.
          - 'heading "Part V: Protection" [level=3] [ref=f4e99]'
          - paragraph [ref=f4e100]:
            - strong [ref=f4e101]:
              - link "9. Insurance" [ref=f4e102] [cursor=pointer]:
                - /url: /articles/personal-finance-india/insurance
            - text: "What your offer letter's group cover actually gives you and where it stops. Term life mechanics and sizing. Health insurance mechanics: sum insured, room rent limits, waiting periods, co-pay, restoration, super top-up, portability. Personal accident cover. The GST change of September 2025. Section 126 (formerly 80D)."
          - 'heading "Part VI: Debt and credit" [level=3] [ref=f4e103]'
          - paragraph [ref=f4e104]:
            - strong [ref=f4e105]:
              - link "10. Credit cards and CIBIL" [ref=f4e106] [cursor=pointer]:
                - /url: /articles/personal-finance-india/credit-cards-cibil
            - text: Billing cycle and grace period, why revolving is arithmetically brutal, the RBI rules that changed in 2026, how a CIBIL score is constructed, and the rewards-versus-interest arithmetic.
          - paragraph [ref=f4e107]:
            - strong [ref=f4e108]:
              - link "11. Loans and getting out of debt" [ref=f4e109] [cursor=pointer]:
                - /url: /articles/personal-finance-india/loans-and-debt
            - text: Education, personal, auto and home loans. Amortisation shown with real numbers. Secured versus unsecured. Avalanche versus snowball. Prepayment mechanics and when banks charge for it.
          - 'heading "Part VII: Investing" [level=3] [ref=f4e110]'
          - paragraph [ref=f4e111]:
            - strong [ref=f4e112]:
              - link "12. Investing" [ref=f4e113] [cursor=pointer]:
                - /url: /articles/personal-finance-india/investing
            - text: Asset classes and their historical behaviour. Mutual fund categories. Direct versus regular plans and what the difference costs over twenty years. Index funds and ETFs. SIP mechanics. Complete FY 2026-27 taxation. Diversification and rebalancing.
          - paragraph [ref=f4e114]:
            - strong [ref=f4e115]:
              - link "13. Fixed income, small savings and gold" [ref=f4e116] [cursor=pointer]:
                - /url: /articles/personal-finance-india/fixed-income-and-gold
            - text: Fixed and recurring deposits, DICGC cover, TDS thresholds. PPF, NSC, SSY, SCSS and current rates. Bonds. Gold after the discontinuation of Sovereign Gold Bonds. Crypto and other Virtual Digital Assets.
          - 'heading "Part VIII: Goals and life" [level=3] [ref=f4e117]'
          - paragraph [ref=f4e118]:
            - strong [ref=f4e119]:
              - link "14. Goals, real estate and family" [ref=f4e120] [cursor=pointer]:
                - /url: /articles/personal-finance-india/goals-and-real-estate
            - text: Emergency funds, projecting a goal, rent versus buy with Indian rental yields, home loan tax treatment, joint finances, nomination versus will.
          - heading "Reference" [level=3] [ref=f4e121]
          - paragraph [ref=f4e122]:
            - strong [ref=f4e123]:
              - link "15. The numbers page" [ref=f4e124] [cursor=pointer]:
                - /url: /articles/personal-finance-india/numbers
            - text: Every limit, rate, threshold and deadline referenced anywhere in this document, in one table, with the date each was last verified. Plus a glossary and full source list.
          - paragraph [ref=f4e125]:
            - strong [ref=f4e126]:
              - link "16. Forms, schemes and official links" [ref=f4e127] [cursor=pointer]:
                - /url: /articles/personal-finance-india/forms-and-links
            - text: "Every portal and form in one place: where to activate your UAN, file EPF e-nomination, open NPS, pull all four credit reports, check a RERA registration, verify an advisor, and complain to the right regulator. Plus the old → new form number map and a one-time setup checklist."
          - paragraph [ref=f4e128]: If you would rather have the argument for spending an afternoon on this before you start reading it, the rest of this page is that argument.
          - separator [ref=f4e129]
          - heading "One question, ₹86,400 a year" [level=2] [ref=f4e130]
          - generic [ref=f4e135]:
            - heading "The Overlooked ₹86,400 Gap" [level=4] [ref=f4e136]
            - generic [ref=f4e137]:
              - paragraph [ref=f4e138]: "There is a question you can put to your employer's payroll team that takes about fifteen seconds to ask:"
              - blockquote [ref=f4e139]:
                - paragraph [ref=f4e140]:
                  - emphasis [ref=f4e141]: "\"Does the company contribute PF on my full Basic, or does it restrict to the ₹15,000 statutory ceiling?\""
              - paragraph [ref=f4e142]:
                - text: At a Basic of ₹75,000 a month, the two possible answers are
                - strong [ref=f4e143]: ₹7,750
                - text: and
                - strong [ref=f4e144]: ₹550
                - text: of employer contribution. The gap is
                - strong [ref=f4e145]: ₹86,400 a year
                - text: — employer money, in your name, in an account that has paid 8.25% for four consecutive years. Both answers are perfectly legal. Neither appears anywhere on your CTC breakup, so nothing in your offer letter tells you which one you are getting.
              - paragraph [ref=f4e146]: Most engineers never ask. Not out of carelessness — the question is only obvious once you know the ceiling exists, and nobody is paid to tell you.
          - paragraph [ref=f4e147]: That is the shape of almost everything in this document.
          - separator [ref=f4e148]
          - heading "The same shape, a dozen times over" [level=2] [ref=f4e149]
          - paragraph [ref=f4e150]: Every row below is a single moment. None takes more than a few minutes. Each has a default that is chosen for you if you say nothing, and the default is rarely the branch that favours you.
