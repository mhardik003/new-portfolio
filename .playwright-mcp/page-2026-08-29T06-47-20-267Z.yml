                - slider [ref=f4e219]: "20"
            - paragraph [ref=f4e222]:
              - text: Over 20 years, the 5% difference in return creates a gap of
              - strong [ref=f4e223]: ₹47,51,825
              - text: . Modest return differences compound exponentially over time.
          - heading "Why the timing carries most of the value" [level=3] [ref=f4e224]
          - paragraph [ref=f4e225]: The rows above are not evenly valuable across a career. Almost every one of them has a window, and the window closes.
          - list [ref=f4e226]:
            - listitem [ref=f4e227]:
              - text: Compounding is an exponential in
              - emphasis [ref=f4e228]: time
              - text: ", so money saved between 25 and 35 produces more terminal wealth in most retirement models than everything saved between 35 and 65."
            - listitem [ref=f4e229]: A prepayment in year 2 of a 20-year loan removes far more total interest than the same rupee in year 15, because that is when the outstanding principal is largest.
            - listitem [ref=f4e230]: Health insurance waiting periods run from the date you buy the policy, not the date you need it.
            - listitem [ref=f4e231]:
              - text: The excluded-employee route out of EPF is available at your
              - strong [ref=f4e232]: first
              - text: job and never again; membership is sticky (
              - link "§7.5" [ref=f4e233] [cursor=pointer]:
                - /url: /articles/personal-finance-india/epf-eps-form-11
              - text: ).
            - listitem [ref=f4e234]: ELSS locks each instalment for three years; the ₹1.25 lakh long-term capital gains exemption resets annually and does not carry forward. Both are clocks, not amounts.
          - paragraph [ref=f4e235]: "None of that is recoverable later by trying harder. Which is the awkward argument for reading this at 23 rather than 33: the material is worth the most precisely when it feels least urgent."
          - separator [ref=f4e236]
          - heading "None of this is a loophole" [level=2] [ref=f4e237]
          - paragraph [ref=f4e238]: Nothing in this document is aggressive, grey-area, or dependent on an advisor. Every mechanism in it is a published rule that has usually been sitting there for years.
          - paragraph [ref=f4e239]:
            - text: Paragraph 26(6) of the EPF Scheme has permitted contributions above the wage ceiling since
            - strong [ref=f4e240]: "1952"
            - text: . Direct plans have existed since
            - strong [ref=f4e241]: "2013"
            - text: . The ₹1.25 lakh annual exemption on long-term equity gains has an annual-reset structure that makes harvesting mechanical arithmetic rather than a strategy. Employer NPS under Section 124(2) is simply a payroll component your company either offers or does not.
          - paragraph [ref=f4e242]: The reason so little of it gets used is not secrecy. It is that the Indian financial system documents itself in circulars, gazette notifications and FAQ pages, and every default inside it is set to whichever branch requires no action from your employer, your bank, or your fund house.
          - table [ref=f4e244]:
            - rowgroup [ref=f4e245]:
              - row [ref=f4e246]:
                - columnheader "What you get by default" [ref=f4e247]
                - columnheader "What is also there, if you go and get it" [ref=f4e248]
