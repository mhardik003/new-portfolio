                - columnheader "Where" [ref=f1e484]
            - rowgroup [ref=f1e485]:
              - row [ref=f1e486]:
                - cell "Regulator — regulations, circulars, orders" [ref=f1e487]
                - cell [ref=f1e488]:
                  - link "SEBI" [ref=f1e489] [cursor=pointer]:
                    - /url: https://www.sebi.gov.in
              - row [ref=f1e490]:
