                - cell [ref=f1e454]:
                  - link "IRDAI" [ref=f1e455] [cursor=pointer]:
                    - /url: https://irdai.gov.in
              - row [ref=f1e456]:
                - cell [ref=f1e457]:
                  - strong [ref=f1e458]: File a complaint against an insurer
                - cell [ref=f1e459]:
                  - link "Bima Bharosa" [ref=f1e460] [cursor=pointer]:
                    - /url: https://bimabharosa.irdai.gov.in
              - row [ref=f1e461]:
                - cell [ref=f1e462]:
                  - strong [ref=f1e463]: Insurance Ombudsman
                  - text: — escalation after the insurer fails to resolve
                - cell [ref=f1e464]:
                  - link "cioins.co.in" [ref=f1e465] [cursor=pointer]:
                    - /url: https://www.cioins.co.in
              - row [ref=f1e466]:
                - cell "Check whether an agent or broker is registered" [ref=f1e467]
                - cell "IRDAI portal → intermediary registers" [ref=f1e468]
              - row [ref=f1e469]:
                - cell "Claim settlement ratios" [ref=f1e470]
                - cell "Published in the IRDAI Annual Report" [ref=f1e471]
          - paragraph [ref=f1e472]:
            - strong [ref=f1e473]: "Before buying:"
            - text: confirm the room-rent limit, co-pay, sub-limits, PED waiting period and restoration terms — these determine whether a policy pays. See
            - link "§9.5" [ref=f1e474] [cursor=pointer]:
              - /url: /articles/personal-finance-india/insurance
            - text: .
          - paragraph [ref=f1e475]:
            - strong [ref=f1e476]: "Escalation path:"
            - text: insurer's grievance officer → Bima Bharosa → Insurance Ombudsman. Each stage has a defined response window.
          - separator [ref=f1e477]
          - heading "16.6 Investing and securities" [level=2] [ref=f1e478]
