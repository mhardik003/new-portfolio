            - rowgroup [ref=f1e422]:
              - row [ref=f1e423]:
                - columnheader "What" [ref=f1e424]
                - columnheader "Where" [ref=f1e425]
            - rowgroup [ref=f1e426]:
              - row [ref=f1e427]:
                - cell "Open and operate PPF, SSY, NSC, SCSS, POMIS, KVP" [ref=f1e428]
                - cell [ref=f1e429]:
                  - link "India Post" [ref=f1e430] [cursor=pointer]:
                    - /url: https://www.indiapost.gov.in
                  - text: ", or a designated branch of most public-sector and several private banks"
              - row [ref=f1e431]:
                - cell "Scheme rules, forms, current rates" [ref=f1e432]
                - cell [ref=f1e433]:
                  - link "National Savings Institute" [ref=f1e434] [cursor=pointer]:
                    - /url: https://www.nsiindia.gov.in
              - row [ref=f1e435]:
                - cell "Quarterly rate notifications" [ref=f1e436]
                - cell "Department of Economic Affairs, Ministry of Finance" [ref=f1e437]
          - paragraph [ref=f1e438]:
            - strong [ref=f1e439]: "Forms:"
            - text: Form A to open an account, Form B to deposit, Form C to withdraw, Form D for a loan, Form H to extend a PPF account beyond 15 years. Most banks now support PPF and SSY entirely through net banking.
          - paragraph [ref=f1e440]:
            - strong [ref=f1e441]: "Timing note:"
            - text: PPF interest is computed on the lowest balance between the
            - strong [ref=f1e442]: 5th and the last day
            - text: of each month. Deposit by the 5th.
          - separator [ref=f1e443]
