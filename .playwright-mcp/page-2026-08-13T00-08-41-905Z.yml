                    - /url: https://www.dicgc.org.in
          - heading "The four credit bureaus" [level=3] [ref=f1e559]
          - paragraph [ref=f1e560]:
            - text: You are entitled to
            - strong [ref=f1e561]: one free full credit report per bureau per calendar year
            - text: . Four bureaus means four free reports.
          - table [ref=f1e563]:
            - rowgroup [ref=f1e564]:
              - row [ref=f1e565]:
                - columnheader "Bureau" [ref=f1e566]
                - columnheader "Where" [ref=f1e567]
            - rowgroup [ref=f1e568]:
              - row [ref=f1e569]:
                - cell [ref=f1e570]:
                  - strong [ref=f1e571]: TransUnion CIBIL
                - cell [ref=f1e572]:
                  - link "cibil.com" [ref=f1e573] [cursor=pointer]:
                    - /url: https://www.cibil.com
              - row [ref=f1e574]:
                - cell [ref=f1e575]:
                  - strong [ref=f1e576]: Experian India
                - cell [ref=f1e577]:
                  - link "experian.in" [ref=f1e578] [cursor=pointer]:
                    - /url: https://www.experian.in
              - row [ref=f1e579]:
                - cell [ref=f1e580]:
                  - strong [ref=f1e581]: Equifax India
                - cell [ref=f1e582]:
                  - link "equifax.co.in" [ref=f1e583] [cursor=pointer]:
                    - /url: https://www.equifax.co.in
              - row [ref=f1e584]:
                - cell [ref=f1e585]:
                  - strong [ref=f1e586]: CRIF High Mark
                - cell [ref=f1e587]:
                  - link "crifhighmark.com" [ref=f1e588] [cursor=pointer]:
                    - /url: https://www.crifhighmark.com
          - paragraph [ref=f1e589]:
            - text: Dispute errors with
            - strong [ref=f1e590]: both
            - text: the bureau and the lender that reported the entry. Closed loans still showing open, and accounts that are not yours, are the two most common defects.
          - paragraph [ref=f1e591]:
            - strong [ref=f1e592]: "Escalation for a bank or card dispute:"
            - text: bank's nodal grievance officer → 30 days → RBI Ombudsman via CMS.
          - separator [ref=f1e593]
          - heading "16.8 Employment and labour" [level=2] [ref=f1e594]
