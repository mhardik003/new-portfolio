                - cell [ref=f1e612]:
                  - link "MCA" [ref=f1e613] [cursor=pointer]:
                    - /url: https://www.mca.gov.in
          - paragraph [ref=f1e614]:
            - strong [ref=f1e615]: "MCA is genuinely useful when evaluating a startup offer:"
            - text: annual returns and financial statements filed by a private company are public, and they tell you more about runway than a recruiter will.
          - separator [ref=f1e616]
          - heading "16.9 Property" [level=2] [ref=f1e617]
          - table [ref=f1e619]:
            - rowgroup [ref=f1e620]:
              - row [ref=f1e621]:
                - columnheader "What" [ref=f1e622]
                - columnheader "Where" [ref=f1e623]
            - rowgroup [ref=f1e624]:
              - row [ref=f1e625]:
                - cell [ref=f1e626]:
                  - strong [ref=f1e627]: RERA
                  - text: — verify a project and developer before buying
                - cell [ref=f1e628]:
                  - text: Each state runs its own RERA portal; find yours via
                  - link "rera.gov.in" [ref=f1e629] [cursor=pointer]:
                    - /url: https://rera.gov.in
              - row [ref=f1e630]:
                - cell "Stamp duty, registration, encumbrance certificates" [ref=f1e631]
                - cell "State registration department portals — these are state-specific" [ref=f1e632]
              - row [ref=f1e633]:
                - cell "Property tax" [ref=f1e634]
                - cell "Municipal corporation portal for your city" [ref=f1e635]
              - row [ref=f1e636]:
                - cell "TDS on property purchase above ₹50 lakh" [ref=f1e637]
                - cell "Form 26QB, via the e-filing portal" [ref=f1e638]
          - paragraph [ref=f1e639]:
            - strong [ref=f1e640]: "Before any purchase:"
            - text: check the RERA registration number, the encumbrance certificate, the approved plan, and the occupancy certificate. GST is nil on ready-to-move property with an occupancy certificate, and 5% without one — see
            - link "§14.6" [ref=f1e641] [cursor=pointer]:
              - /url: /articles/personal-finance-india/goals-and-real-estate
            - text: .
          - separator [ref=f1e642]
          - heading "16.10 Consumer protection" [level=2] [ref=f1e643]
          - table [ref=f1e645]:
            - rowgroup [ref=f1e646]:
              - row [ref=f1e647]:
                - columnheader "What" [ref=f1e648]
                - columnheader "Where" [ref=f1e649]
            - rowgroup [ref=f1e650]:
              - row [ref=f1e651]:
                - cell "National Consumer Helpline" [ref=f1e652]
                - cell [ref=f1e653]:
                  - link "consumerhelpline.gov.in" [ref=f1e654] [cursor=pointer]:
                    - /url: https://consumerhelpline.gov.in
                  - text: — 1915
              - row [ref=f1e655]:
                - cell "Cyber fraud, including financial fraud" [ref=f1e656]
                - cell [ref=f1e657]:
                  - link "cybercrime.gov.in" [ref=f1e658] [cursor=pointer]:
                    - /url: https://cybercrime.gov.in
                  - text: — 1930
          - paragraph [ref=f1e659]:
            - strong [ref=f1e660]: If money leaves your account fraudulently, report it immediately.
            - text: RBI's limited-liability framework reduces or eliminates a customer's liability for unauthorised electronic transactions where the incident is reported promptly — the customer's exposure rises the longer the delay.
          - separator [ref=f1e661]
          - heading "16.11 Things worth doing once" [level=2] [ref=f1e662]
          - paragraph [ref=f1e663]: Each of these takes minutes, costs nothing, and is routinely left undone for years.
          - list [ref=f1e664]:
            - listitem [ref=f1e665]:
              - checkbox [disabled] [ref=f1e666]
              - strong [ref=f1e667]: Activate your UAN
              - text: and seed Aadhaar, PAN and bank account —
              - link "member portal" [ref=f1e668] [cursor=pointer]:
                - /url: https://unifiedportal-mem.epfindia.gov.in/memberinterface/
            - listitem [ref=f1e669]:
              - checkbox [disabled] [ref=f1e670]
              - strong [ref=f1e671]: File EPF e-nomination
              - text: — covers EPF, EPS and EDLI in one submission
            - listitem [ref=f1e672]:
              - checkbox [disabled] [ref=f1e673]
              - strong [ref=f1e674]: Check your EPF passbook
              - text: and confirm whether your employer contributes on full Basic or on the ₹15,000 ceiling
            - listitem [ref=f1e675]:
              - checkbox [disabled] [ref=f1e676]
              - strong [ref=f1e677]: Confirm old PF has transferred
              - text: rather than sitting dormant under a previous Member ID
            - listitem [ref=f1e678]:
              - checkbox [disabled] [ref=f1e679]
              - strong [ref=f1e680]: Nominate
              - text: on every bank account, deposit, demat account, mutual fund folio, insurance policy, PPF account and NPS PRAN
            - listitem [ref=f1e681]:
              - checkbox [disabled] [ref=f1e682]
              - strong [ref=f1e683]: Pull all four credit reports
              - text: and dispute any errors
            - listitem [ref=f1e684]:
              - checkbox [disabled] [ref=f1e685]
              - strong [ref=f1e686]: Link PAN and Aadhaar
              - text: ", and check your AIS against your own records"
            - listitem [ref=f1e687]:
              - checkbox [disabled] [ref=f1e688]
              - strong [ref=f1e689]: Verify your advisor's SEBI registration
              - text: if you use one, and establish who pays them
            - listitem [ref=f1e690]:
              - checkbox [disabled] [ref=f1e691]
              - strong [ref=f1e692]: Ask HR
              - text: whether the company offers employer NPS under Section 124(2) — it is the only significant deduction left in the new regime
            - listitem [ref=f1e693]:
              - checkbox [disabled] [ref=f1e694]
              - strong [ref=f1e695]: Find the room-rent limit
              - text: on your employer's group health policy
            - listitem [ref=f1e696]:
              - checkbox [disabled] [ref=f1e697]
              - strong [ref=f1e698]: Write a will
              - text: — a nominee is a trustee, not an heir
          - separator [ref=f1e699]
          - heading "16.12 Where each number in this document came from" [level=2] [ref=f1e700]
          - paragraph [ref=f1e701]:
            - text: The complete source list, with links to every reference used, is in
            - strong [ref=f1e702]:
              - link "§15.17" [ref=f1e703] [cursor=pointer]:
                - /url: /articles/personal-finance-india/numbers
            - text: . The items still in flux as of August 2026 — the EPF wage ceiling revision, EPS-95 higher pension, the NPS 80% withdrawal mismatch, and the HRA metro-city expansion — are listed in
            - strong [ref=f1e704]:
              - link "§15.15" [ref=f1e705] [cursor=pointer]:
