              - row [ref=f1e509]:
                - cell [ref=f1e510]:
                  - strong [ref=f1e511]: Consolidated view of all your mutual funds, update KYC, nominations
                - cell [ref=f1e512]:
                  - link "MF Central" [ref=f1e513] [cursor=pointer]:
                    - /url: https://www.mfcentral.com
              - row [ref=f1e514]:
                - cell "Demat holdings and statements" [ref=f1e515]
                - cell [ref=f1e516]:
                  - link "NSDL" [ref=f1e517] [cursor=pointer]:
                    - /url: https://nsdl.com
                  - text: or
                  - link "CDSL" [ref=f1e518] [cursor=pointer]:
                    - /url: https://www.cdslindia.com
              - row [ref=f1e519]:
                - cell [ref=f1e520]:
                  - strong [ref=f1e521]: Buy government securities and T-bills directly, no intermediary
                - cell [ref=f1e522]:
                  - link "RBI Retail Direct" [ref=f1e523] [cursor=pointer]:
                    - /url: https://rbiretaildirect.org.in
              - row [ref=f1e524]:
                - cell "Market data, index factsheets, TRI values" [ref=f1e525]
                - cell [ref=f1e526]:
                  - link "NSE" [ref=f1e527] [cursor=pointer]:
                    - /url: https://www.nseindia.com
                  - text: and
                  - link "BSE" [ref=f1e528] [cursor=pointer]:
                    - /url: https://www.bseindia.com
          - paragraph [ref=f1e529]:
            - strong [ref=f1e530]: Buy direct plans
            - text: from the AMC's own site, MF Central, or a platform that does not embed distributor commission — roughly 0.65% a year cheaper for equity funds. See
            - link "§12.4" [ref=f1e531] [cursor=pointer]:
              - /url: /articles/personal-finance-india/investing
            - text: .
          - separator [ref=f1e532]
