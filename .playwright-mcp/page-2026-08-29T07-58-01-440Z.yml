          - heading "5.1 The three categories" [level=2] [ref=f1e136]
          - paragraph [ref=f1e137]: "Everything your employer gives you falls into one of three buckets, and the tax treatment differs sharply:"
          - table [ref=f1e139]:
            - rowgroup [ref=f1e140]:
              - row [ref=f1e141]:
                - columnheader "Category" [ref=f1e142]
                - columnheader "Definition" [ref=f1e143]
                - columnheader "Tax treatment" [ref=f1e144]
            - rowgroup [ref=f1e145]:
              - row [ref=f1e146]:
                - cell [ref=f1e147]:
                  - strong [ref=f1e148]: Allowance
                - cell "A fixed cash sum paid to you, whether or not you spend it" [ref=f1e149]
                - cell [ref=f1e150]:
                  - text: Taxable unless a specific exemption applies. Most exemptions require
                  - emphasis [ref=f1e151]: actual expenditure
                  - text: .
              - row [ref=f1e152]:
                - cell [ref=f1e153]:
                  - strong [ref=f1e154]: Reimbursement
                - cell "Repayment of an expense you incurred, against a bill" [ref=f1e155]
                - cell "Not taxable if genuinely incurred for the specified purpose and supported by documentation" [ref=f1e156]
              - row [ref=f1e157]:
                - cell [ref=f1e158]:
                  - strong [ref=f1e159]: Perquisite
                - 'cell "A benefit in kind: something provided, not paid" [ref=f1e160]'
                - cell "Taxable at a value determined by the Rules, unless specifically excluded" [ref=f1e161]
          - paragraph [ref=f1e162]:
            - strong [ref=f1e163]: "The single most useful distinction in Indian salary structuring:"
            - text: the same rupee is treated differently depending on whether it is called an
            - emphasis [ref=f1e164]: allowance
            - text: or a
            - emphasis [ref=f1e165]: reimbursement
            - text: .
          - list [ref=f1e166]:
            - listitem [ref=f1e167]:
              - text: "\"Relocation"
              - strong [ref=f1e168]: allowance
              - text: of ₹1,00,000" → fully taxable at slab rate
            - listitem [ref=f1e169]:
              - text: "\"Relocation"
              - strong [ref=f1e170]: reimbursement
              - text: up to ₹1,00,000 against bills" → not taxable
          - paragraph [ref=f1e171]: If your offer letter uses the word "allowance" for something you expected to be tax-free, that is worth raising before you sign.
          - separator [ref=f1e172]
          - heading "5.2 What changed for FY 2026-27" [level=2] [ref=f1e173]
          - paragraph [ref=f1e174]: The Income-tax Act, 2025 and the Income-tax Rules, 2026 raised several perquisite limits that had been frozen since the 1990s.
          - table [ref=f1e176]:
            - rowgroup [ref=f1e177]:
              - row [ref=f1e178]:
                - columnheader "Item" [ref=f1e179]
                - columnheader "Old limit" [ref=f1e180]
                - columnheader [ref=f1e181]:
                  - strong [ref=f1e182]: FY 2026-27
            - rowgroup [ref=f1e183]:
              - row [ref=f1e184]:
                - cell "Free / subsidised meals at office or via meal vouchers" [ref=f1e185]
                - cell "₹50 per meal" [ref=f1e186]
                - cell [ref=f1e187]:
                  - strong [ref=f1e188]: ₹200 per meal
              - row [ref=f1e189]:
                - cell "Non-cash gifts, vouchers, hampers" [ref=f1e190]
                - cell "₹5,000 per year" [ref=f1e191]
                - cell [ref=f1e192]:
                  - strong [ref=f1e193]: ₹15,000 per year
              - row [ref=f1e194]:
                - cell "Children's education allowance" [ref=f1e195]
                - cell "₹100 per month per child" [ref=f1e196]
                - cell [ref=f1e197]:
                  - strong [ref=f1e198]: ₹3,000 per month per child
              - row [ref=f1e199]:
                - cell "Children's hostel allowance" [ref=f1e200]
                - cell "₹300 per month per child" [ref=f1e201]
                - cell [ref=f1e202]:
                  - strong [ref=f1e203]: ₹9,000 per month per child
              - row [ref=f1e204]:
                - 'cell "Employer medical loan: exemption ceiling" [ref=f1e205]'
                - cell "₹20,000" [ref=f1e206]
                - cell [ref=f1e207]:
                  - strong [ref=f1e208]: ₹2,00,000
              - row [ref=f1e209]:
                - 'cell "Overseas medical treatment: income threshold for exemption" [ref=f1e210]'
                - cell "₹2,00,000" [ref=f1e211]
                - cell [ref=f1e212]:
                  - strong [ref=f1e213]: ₹8,00,000
              - row [ref=f1e214]:
                - 'cell "HRA: cities at 50% of salary" [ref=f1e215]'
                - cell "4 (Delhi, Mumbai, Kolkata, Chennai)" [ref=f1e216]
                - cell [ref=f1e217]:
                  - strong [ref=f1e218]: "8"
                  - text: (adds Bengaluru, Hyderabad, Pune, Ahmedabad)
          - blockquote [ref=f1e219]:
            - paragraph [ref=f1e220]:
              - strong [ref=f1e221]: Verify before relying on the HRA change.
              - text: The expansion from four to eight cities is reported consistently across tax portals as being effected by the Income-tax Rules, 2026 with effect from FY 2026-27, but some references still list only the original four metros. Confirm against the notified Rules or with your employer's payroll before claiming 50% for Bengaluru, Hyderabad, Pune or Ahmedabad. For FY 2025-26 returns, the old four-metro rule applies.
          - separator [ref=f1e222]
          - heading "5.3 House Rent Allowance (HRA)" [level=2] [ref=f1e223]
          - paragraph [ref=f1e224]:
            - strong [ref=f1e225]: Old regime only. Fully taxable in the new regime.
          - paragraph [ref=f1e226]:
            - text: The exemption is the
            - strong [ref=f1e227]: least of three
            - text: ":"
          - generic [ref=f1e229]:
            - generic [ref=f1e230]: 1. Actual HRA received
            - generic [ref=f1e231]: 2. Rent paid, less 10% of salary
            - generic [ref=f1e232]: 3. 50% of salary in the eight metro cities, 40% of salary everywhere else
            - generic [ref=f1e233]: Delhi, Mumbai, Kolkata, Chennai, Bengaluru, Hyderabad, Pune, Ahmedabad
          - paragraph [ref=f1e234]:
            - text: "\"Salary\" here means"
            - strong [ref=f1e235]: Basic + DA + any commission on turnover
            - text: .
          - heading "Worked example" [level=3] [ref=f1e236]
          - paragraph [ref=f1e237]: Bengaluru. Basic ₹9,00,000/yr. HRA ₹3,60,000/yr. Rent paid ₹30,000/month = ₹3,60,000/yr.
          - generic [ref=f1e239]:
            - generic [ref=f1e240]:
              - text: 1. Actual HRA received
              - generic [ref=f1e241]: ₹3,60,000
            - generic [ref=f1e242]:
              - text: 2. Rent paid, less 10% of salary
              - generic [ref=f1e243]: ₹2,70,000least
            - generic [ref=f1e244]: ₹3,60,000 rent − ₹90,000, being 10% of salary
            - generic [ref=f1e245]:
              - text: 3. 50% of salary (Bengaluru, FY 2026-27)
              - generic [ref=f1e246]: ₹4,50,000
            - generic [ref=f1e247]:
              - text: Exemption
              - generic [ref=f1e248]: ₹2,70,000
            - generic [ref=f1e249]:
              - text: Taxable HRA
              - generic [ref=f1e250]: ₹90,000
          - paragraph [ref=f1e251]: "Note how the second condition binds: paying rent equal to your HRA does not make your HRA fully exempt, because 10% of salary is always subtracted."
          - heading "Documentation" [level=3] [ref=f1e252]
          - table [ref=f1e254]:
            - rowgroup [ref=f1e255]:
              - row [ref=f1e256]:
                - columnheader "Annual rent" [ref=f1e257]
                - columnheader "Requirement" [ref=f1e258]
            - rowgroup [ref=f1e259]:
              - row [ref=f1e260]:
                - cell "Any amount" [ref=f1e261]
                - cell "Rent receipts" [ref=f1e262]
              - row [ref=f1e263]:
                - cell "Above ₹1,00,000" [ref=f1e264]
                - cell [ref=f1e265]:
                  - strong [ref=f1e266]: Landlord's PAN
                  - text: mandatory
              - row [ref=f1e267]:
                - cell "Above ₹1,00,000" [ref=f1e268]
                - cell "Rent agreement generally required by employers" [ref=f1e269]
              - row [ref=f1e270]:
                - cell "From FY 2026-27" [ref=f1e271]
                - cell [ref=f1e272]:
                  - strong [ref=f1e273]: Form 124
                  - text: (replacing Form 12BB) requires disclosure of your
                  - strong [ref=f1e274]: relationship with the landlord
          - paragraph [ref=f1e275]: That last point is a deliberate anti-abuse measure. Paying rent to a parent is legally permissible (the parent must actually own the property and must declare the rental income), but it is now explicitly disclosed and is a known audit trigger. Paying rent to a spouse is generally not accepted.
          - heading "If you receive no HRA" [level=3] [ref=f1e276]
          - paragraph [ref=f1e277]:
            - strong [ref=f1e278]: Section 134 (formerly 80GG)
            - text: "allows a deduction for rent paid where no HRA is received: the least of ₹5,000/month, 25% of total income, or rent paid minus 10% of total income. Old regime only. Not available if you, your spouse, or your minor child own residential property at the place of work."
          - separator [ref=f1e279]
          - heading "5.4 Leave Travel Allowance (LTA)" [level=2] [ref=f1e280]
          - paragraph [ref=f1e281]:
            - strong [ref=f1e282]: Old regime only.
          - list [ref=f1e283]:
            - listitem [ref=f1e284]:
              - text: Exempt against
              - strong [ref=f1e285]: actual travel expenditure
              - text: on tickets for domestic travel only. International travel does not qualify.
            - listitem [ref=f1e286]: Covers you, spouse, children, and dependent parents/siblings.
            - listitem [ref=f1e287]:
              - text: Covers
              - strong [ref=f1e288]: travel fare only
              - text: ", not hotels, food, local transport or sightseeing."
            - listitem [ref=f1e289]:
              - text: Claimable
              - strong [ref=f1e290]: twice in a block of four calendar years
              - text: . The current block is
              - strong [ref=f1e291]: 2026–2029
              - text: .
            - listitem [ref=f1e292]: One unclaimed journey can be carried into the first year of the next block.
            - listitem [ref=f1e293]: Air travel is restricted to economy class on the shortest route; rail to first-class AC.
          - paragraph [ref=f1e294]: Unclaimed LTA is paid out as fully taxable salary.
          - separator [ref=f1e295]
          - heading "5.5 Relocation" [level=2] [ref=f1e296]
          - paragraph [ref=f1e297]: This is the component most often mis-structured.
          - table [ref=f1e299]:
            - rowgroup [ref=f1e300]:
              - row [ref=f1e301]:
                - columnheader "Form" [ref=f1e302]
                - columnheader "Taxable?" [ref=f1e303]
            - rowgroup [ref=f1e304]:
              - row [ref=f1e305]:
                - cell [ref=f1e306]:
                  - strong [ref=f1e307]: Reimbursement of actual relocation expenses against bills
                - cell [ref=f1e308]:
                  - strong [ref=f1e309]: Not taxable
              - row [ref=f1e310]:
