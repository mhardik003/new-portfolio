          - heading "5. Salary Structuring, Allowances and Perquisites" [level=1] [ref=f1e98]
          - paragraph [ref=f1e99]:
            - emphasis [ref=f1e100]: What is exempt, what is a taxable perquisite, and what changed for FY 2026-27.
          - separator [ref=f1e101]
          - paragraph [ref=f1e102]:
            - strong [ref=f1e103]: The new regime did not remove employer-side benefits, only employee-side deductions.
            - text: With two exceptions — the standard deduction, and interest on a let-out property — everything that survives in both regimes is something your employer provides or reimburses against a bill, and everything confined to the old regime is something you pay for yourself and then deduct. The Income-tax Rules, 2026 then raised several of the employer-side ceilings, the children's education and hostel allowances by a factor of thirty.
          - paragraph [ref=f1e104]: The locus of tax efficiency has therefore moved from your investment choices to your salary structure. Under the old regime the decisions that reduced your tax bill were yours, and were taken during the year. Under the new regime they were taken before you signed, by whoever chose the components in your offer letter.
          - paragraph [ref=f1e105]:
            - text: The sections below state the treatment of each component.
            - strong [ref=f1e106]:
              - link "§5.11" [ref=f1e107] [cursor=pointer]:
                - /url: "#511-which-of-these-survive-in-the-new-regime"
            - text: has both lists in full.
