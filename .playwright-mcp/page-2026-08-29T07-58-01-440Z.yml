                  - text: Exempt up to
                  - strong [ref=f1e363]: ₹3,200/month
                  - text: ; this exemption survives in
                  - strong [ref=f1e364]: both
                  - text: regimes
              - row [ref=f1e365]:
                - cell [ref=f1e366]:
                  - strong [ref=f1e367]: Employer-owned car provided to you
                - cell "Taxable perquisite valued under the Rules; the value depends on engine capacity, whether a driver is provided, and whether use is official, personal or both" [ref=f1e368]
          - paragraph [ref=f1e369]:
            - text: "The upshot:"
            - strong [ref=f1e370]: a company cab is worth more after tax than the equivalent cash.
            - text: ₹8,000/month of cab facility costs you nothing; ₹8,000/month of transport allowance costs you ₹2,400–₹2,900 in tax at a 30% marginal rate.
          - separator [ref=f1e371]
          - heading "5.7 Meal cards and food" [level=2] [ref=f1e372]
          - list [ref=f1e373]:
            - listitem [ref=f1e374]:
              - text: Free or subsidised meals provided at the workplace, or through
              - strong [ref=f1e375]: non-transferable electronic meal vouchers
              - text: usable only at eating establishments, are exempt up to
              - strong [ref=f1e376]: ₹200 per meal
              - text: from FY 2026-27 (previously ₹50).
            - listitem [ref=f1e377]:
              - text: Assuming two meals per working day over roughly 22 working days, that is around
              - strong [ref=f1e378]: ₹8,800/month
              - text: ", against roughly ₹2,200/month under the old limit."
            - listitem [ref=f1e379]: Tea, coffee and non-alcoholic beverages during working hours are exempt without limit.
            - listitem [ref=f1e380]: Cash paid in lieu of meals is fully taxable.
            - listitem [ref=f1e381]:
              - strong [ref=f1e382]: Available in both regimes.
          - paragraph [ref=f1e383]: This is now a materially larger benefit than it was, and Indian employers are actively restructuring meal-card components upward in response.
          - separator [ref=f1e384]
          - heading "5.8 Telephone and internet" [level=2] [ref=f1e385]
          - list [ref=f1e386]:
            - listitem [ref=f1e387]:
              - text: Reimbursement of
              - strong [ref=f1e388]: telephone, mobile and broadband bills for official use
              - text: is not a taxable perquisite, under the perquisite valuation rules.
            - listitem [ref=f1e389]:
              - text: The requirement is
              - strong [ref=f1e390]: actual bills in your name
              - text: submitted to the employer. A fixed monthly "telephone allowance" with no bill requirement is taxable.
            - listitem [ref=f1e391]: There is no statutory rupee cap, but the amount must be reasonable relative to your role. Employers typically set internal limits of ₹1,000–₹3,000/month.
            - listitem [ref=f1e392]:
              - strong [ref=f1e393]: Available in both regimes.
          - separator [ref=f1e394]
          - heading "5.9 Children's education and hostel" [level=2] [ref=f1e395]
          - table [ref=f1e397]:
            - rowgroup [ref=f1e398]:
              - row [ref=f1e399]:
                - columnheader "Item" [ref=f1e400]
                - columnheader "FY 2026-27 exemption" [ref=f1e401]
            - rowgroup [ref=f1e402]:
              - row [ref=f1e403]:
                - cell "Children's education allowance" [ref=f1e404]
                - cell [ref=f1e405]:
                  - strong [ref=f1e406]: ₹3,000 per month per child
                  - text: ", maximum 2 children"
              - row [ref=f1e407]:
                - cell "Children's hostel expenditure allowance" [ref=f1e408]
                - cell [ref=f1e409]:
                  - strong [ref=f1e410]: ₹9,000 per month per child
                  - text: ", maximum 2 children"
          - paragraph [ref=f1e411]:
            - text: Combined, that is up to
            - strong [ref=f1e412]: ₹2,88,000 per year
            - text: for two children in hostels, against ₹9,600 under the old limits. This is one of the largest proportional increases in the new Rules.
          - paragraph [ref=f1e413]:
            - text: Separately, and only in the
            - strong [ref=f1e414]: old regime
            - text: ","
            - strong [ref=f1e415]: tuition fees
            - text: paid for up to two children qualify within the ₹1.5 lakh Section 123 (80C) basket.
          - separator [ref=f1e416]
          - heading "5.10 Gifts, vouchers and other items" [level=2] [ref=f1e417]
          - table [ref=f1e419]:
            - rowgroup [ref=f1e420]:
              - row [ref=f1e421]:
                - columnheader "Item" [ref=f1e422]
                - columnheader "Treatment FY 2026-27" [ref=f1e423]
            - rowgroup [ref=f1e424]:
              - row [ref=f1e425]:
                - cell [ref=f1e426]:
                  - strong [ref=f1e427]: Non-cash gifts, vouchers, hampers
                - cell [ref=f1e428]:
                  - text: Exempt up to
                  - strong [ref=f1e429]: ₹15,000 per year
                  - text: (was ₹5,000). Cash gifts are fully taxable regardless of amount.
              - row [ref=f1e430]:
                - cell [ref=f1e431]:
                  - strong [ref=f1e432]: Uniform allowance
                - cell "Exempt against actual expenditure on a uniform required to be worn on duty" [ref=f1e433]
              - row [ref=f1e434]:
                - cell [ref=f1e435]:
                  - strong [ref=f1e436]: Books and periodicals reimbursement
                - cell "Not taxable against bills for professional books, journals, and (as employers commonly apply it) technical courses and certifications" [ref=f1e437]
              - row [ref=f1e438]:
                - cell [ref=f1e439]:
                  - strong [ref=f1e440]: Professional development / certification
                - cell "Not taxable where the employer pays or reimburses training directly connected to your duties" [ref=f1e441]
              - row [ref=f1e442]:
                - cell [ref=f1e443]:
                  - strong [ref=f1e444]: Laptop, phone, equipment provided for use
                - cell "Not a taxable perquisite while owned by the employer. If transferred to you, valued at written-down value under the Rules; computers depreciate at 50% per year on WDV for this purpose" [ref=f1e445]
              - row [ref=f1e446]:
                - cell [ref=f1e447]:
                  - strong [ref=f1e448]: Employer-provided accommodation
                - cell "Taxable perquisite, valued by population of the city and whether the property is owned or leased by the employer" [ref=f1e449]
              - row [ref=f1e450]:
                - cell [ref=f1e451]:
                  - strong [ref=f1e452]: Interest-free or concessional employer loan
                - cell [ref=f1e453]:
                  - text: Taxable perquisite measured against SBI's lending rate. Exempt where the total of all such loans does not exceed ₹20,000, and for medical treatment of specified diseases up to
                  - strong [ref=f1e454]: ₹2,00,000
                  - text: from FY 2026-27
              - row [ref=f1e455]:
                - cell [ref=f1e456]:
                  - strong [ref=f1e457]: Employer's contribution to EPF, NPS, superannuation
                - cell [ref=f1e458]:
                  - text: Exempt individually, but the
                  - strong [ref=f1e459]: aggregate above ₹7,50,000 per year is a taxable perquisite
                  - text: ", as is the annual accretion on the excess"
              - row [ref=f1e460]:
                - cell [ref=f1e461]:
                  - strong [ref=f1e462]: Group health / term life / accident premium paid by employer
                - cell "Not a taxable perquisite" [ref=f1e463]
              - row [ref=f1e464]:
                - cell [ref=f1e465]:
                  - strong [ref=f1e466]: Leave encashment during service
                - cell "Fully taxable" [ref=f1e467]
              - row [ref=f1e468]:
                - cell [ref=f1e469]:
                  - strong [ref=f1e470]: Leave encashment at retirement or resignation
                - cell [ref=f1e471]:
                  - text: Exempt up to
                  - strong [ref=f1e472]: ₹25,00,000
                  - text: lifetime, non-government employees
              - row [ref=f1e473]:
                - cell [ref=f1e474]:
                  - strong [ref=f1e475]: Gratuity
                - cell [ref=f1e476]:
                  - text: Exempt up to
                  - strong [ref=f1e477]: ₹20,00,000
                  - text: lifetime, non-government employees
          - separator [ref=f1e478]
          - heading "5.11 Which of these survive in the new regime" [level=2] [ref=f1e479]
          - paragraph [ref=f1e480]: This is the practical summary most people want.
          - heading [level=3] [ref=f1e481]:
            - text: Survives in
            - strong [ref=f1e482]: both
            - text: regimes
          - list [ref=f1e483]:
            - listitem [ref=f1e484]: Standard deduction (₹75,000 new / ₹50,000 old)
            - listitem [ref=f1e485]: "Employer's NPS contribution: up to 14% of Basic+DA"
            - listitem [ref=f1e486]: Employer-provided cab / bus for commuting
            - listitem [ref=f1e487]: Meal vouchers up to ₹200/meal
            - listitem [ref=f1e488]: Telephone and internet reimbursement against bills
            - listitem [ref=f1e489]: Relocation reimbursement against bills
            - listitem [ref=f1e490]: Children's education (₹3,000/month/child) and hostel (₹9,000/month/child) allowance
            - listitem [ref=f1e491]: Gift vouchers up to ₹15,000/year
            - listitem [ref=f1e492]: Uniform, books and periodicals, professional development against bills
            - listitem [ref=f1e493]: Transport allowance for employees with specified disabilities (₹3,200/month)
            - listitem [ref=f1e494]: Gratuity (₹20 lakh) and leave encashment on exit (₹25 lakh)
            - listitem [ref=f1e495]: Employer's EPF contribution, within the ₹7.5 lakh aggregate cap
            - listitem [ref=f1e496]:
              - text: Home loan interest on a
              - strong [ref=f1e497]: let-out
              - text: property
          - heading [level=3] [ref=f1e498]:
            - text: Old regime
            - strong [ref=f1e499]: only
          - list [ref=f1e500]:
            - listitem [ref=f1e501]: HRA exemption
            - listitem [ref=f1e502]: LTA exemption
            - listitem [ref=f1e503]: "Section 123 (80C): ₹1.5 lakh basket"
            - listitem [ref=f1e504]: "Section 124(1)/(1B): your own NPS contributions"
            - listitem [ref=f1e505]: "Section 126 (80D): health insurance"
            - listitem [ref=f1e506]: "Section 129 (80E): education loan interest"
            - listitem [ref=f1e507]: "Section 133 (80G): donations"
            - listitem [ref=f1e508]: "Section 153 (80TTA/80TTB): deposit interest"
            - listitem [ref=f1e509]:
              - text: Home loan interest on a
              - strong [ref=f1e510]: self-occupied
              - text: property (₹2 lakh)
            - listitem [ref=f1e511]: Professional tax paid
          - separator [ref=f1e512]
          - heading "5.12 What the increases are worth" [level=2] [ref=f1e513]
          - paragraph [ref=f1e514]: "Meal vouchers, gift vouchers, children's education and hostel allowance together moved from a combined ceiling of roughly ₹22,000 a year to roughly ₹4,00,000 a year for an employee with two children in hostels. For an engineer without children, the meaningful increase is meal vouchers: roughly ₹79,000 a year of newly-exempt value, worth about ₹24,000 in tax at a 30% marginal rate."
          - paragraph [ref=f1e515]: None of it is claimable in your return. Every item in the "both regimes" list is a line someone in payroll has to put on your payslip, and headroom your employer has not used is worth nothing to you. Whether your employer restructures to use these headroom limits is a payroll decision, not a tax one. It is a reasonable thing to ask HR about.
