                  - strong [ref=f1e312]: Lump-sum "relocation allowance"
                  - text: with no bill requirement
                - cell [ref=f1e313]:
                  - strong [ref=f1e314]: Fully taxable
                  - text: at slab rate
          - paragraph [ref=f1e315]:
            - strong [ref=f1e316]: "What is covered by a genuine reimbursement:"
          - list [ref=f1e317]:
            - listitem [ref=f1e318]: Packing, moving and transportation of household goods
            - listitem [ref=f1e319]: Transit insurance on goods
            - listitem [ref=f1e320]: Travel fare for you and your family to the new location
            - listitem [ref=f1e321]: Temporary accommodation for a reasonable initial period (commonly 15–30 days)
            - listitem [ref=f1e322]: Brokerage on securing new accommodation, where the employer's policy covers it
            - listitem [ref=f1e323]: Car transportation
          - paragraph [ref=f1e324]:
            - strong [ref=f1e325]: "What is not:"
          - list [ref=f1e326]:
            - listitem [ref=f1e327]: Any surplus paid to you that you keep
            - listitem [ref=f1e328]: Ongoing rent after the temporary period (that is HRA territory)
            - listitem [ref=f1e329]: Loss on sale of assets at the old location
          - paragraph [ref=f1e330]:
            - strong [ref=f1e331]: Available in both regimes
            - text: ", because this is a reimbursement of employer-directed expenditure, not a Chapter VI-A deduction."
          - paragraph [ref=f1e332]:
            - strong [ref=f1e333]: "Practical points:"
            - text: keep every invoice; ask whether your employer's vendor bills the company directly (cleanest); and check whether the relocation carries its own clawback (many do).
          - separator [ref=f1e334]
          - heading "5.6 Transport, cab and conveyance" [level=2] [ref=f1e335]
          - paragraph [ref=f1e336]: A frequently-confused set of three different things.
