          - heading "What to take from this" [level=2] [ref=e593]
          - list [ref=e594]:
            - listitem [ref=e595]:
              - strong [ref=e596]: CTC overstates your income by roughly 17–22%
              - text: "at this level, before tax: 17.9% under the 35%-Basic structure of Step 7, 21.8% under the 50%-Basic structure of Steps 1–5."
            - listitem [ref=e597]:
              - strong [ref=e598]: Most of the gap is not lost
              - text: ": about two-thirds of it is your own money sitting in EPF and gratuity."
            - listitem [ref=e599]:
              - strong [ref=e600]: The new regime wins for the default early-career case
              - text: ": renting, no home loan, ordinary deductions."
            - listitem [ref=e601]:
              - strong [ref=e602]: Employer NPS is the one lever that still works
              - text: under the new regime, and it converts cash into a locked retirement asset rather than creating value from nothing.
            - listitem [ref=e603]:
              - strong [ref=e604]: Structure matters as much as quantum.
              - text: The same ₹18 lakh produces different cash, different EPF, and different gratuity depending on how it is split.
