          - paragraph [ref=e518]:
            - strong [ref=e519]: Section 124(2) is the only significant deduction still available in the new regime.
            - text: It is capped at 14% of Basic + DA; at this Basic, that would be ₹1,26,000, saving roughly ₹19,600 in tax.
          - paragraph [ref=e520]:
            - text: "The trade-off is stated plainly:"
            - strong [ref=e521]: ₹90,000 of spendable cash becomes ₹90,000 locked until age 60, and you save ₹14,040 in tax for making the swap.
            - text: Whether that is worthwhile depends on whether you would have saved that ₹90,000 anyway, and on how much you value liquidity, not on the tax figure alone.
