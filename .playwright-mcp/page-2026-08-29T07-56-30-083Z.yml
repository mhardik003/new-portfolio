          - paragraph [ref=e590]:
            - text: "That is the Labour Codes in one table:"
            - strong [ref=e591]: same CTC, less cash now, materially more deferred savings.
            - text: It is not optional, and it is worth understanding before concluding that your take-home "went down for no reason."
