        - generic [ref=f3e128]:
          - heading "2. Decoding an Indian Offer Letter" [level=1] [ref=f3e129]
          - paragraph [ref=f3e130]:
            - emphasis [ref=f3e131]: Why the number in your offer letter is not the number in your bank account.
          - separator [ref=f3e132]
          - paragraph [ref=f3e133]:
            - strong [ref=f3e134]: A ₹18 lakh CTC offer typically produces around ₹14 lakh of annual in-hand pay, roughly 78%.
            - text: The missing ₹4 lakh is not one deduction. Part of it is the employer's own contributions, premiums and provisions — real cost to the company, never cash to you. Part of it reaches you, but into an account you cannot draw on for decades. The rest is tax.
          - paragraph [ref=f3e135]:
            - text: "The practical rule:"
            - strong [ref=f3e136]: compare offers on in-hand plus vested-equity value, never on CTC.
            - text: Two ₹20 lakh CTC offers can differ by well over ₹1 lakh a year in cash, purely through structuring.
          - separator [ref=f3e137]
          - navigation "Sections in this chapter" [ref=f3e138]:
            - paragraph [ref=f3e139]: In this chapter
