          - code [ref=f2e276]: "Gross salary ₹12,75,000 Less standard deduction ₹ 75,000 Total income ₹12,00,000 Tax: ₹0–4L @ 0% = ₹ 0 ₹4L–8L @ 5% = ₹ 20,000 ₹8L–12L @ 10% = ₹ 40,000 ───────── ₹ 60,000 Less rebate u/s 156 ₹ 60,000 ───────── Tax payable ₹ 0"
          - paragraph [ref=f2e277]:
