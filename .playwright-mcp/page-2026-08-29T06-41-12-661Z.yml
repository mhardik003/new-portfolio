          - heading "4.1 What changed on 1 April 2026" [level=2] [ref=f2e70]
          - paragraph [ref=f2e71]:
            - text: The
            - strong [ref=f2e72]: Income-tax Act, 2025
            - text: "replaced the Income-tax Act, 1961 with effect from 1 April 2026, after 65 years. It is a restatement rather than a rewrite of policy: 819 sections in 23 chapters became"
            - strong [ref=f2e73]: 536 sections in 23 chapters
            - text: ", with simplified drafting and redundant provisions removed. Rates, slabs and most substantive rules carried over."
          - paragraph [ref=f2e74]: "What did change, and what will trip you up:"
          - heading "\"Tax Year\" replaces two terms" [level=3] [ref=f2e75]
          - paragraph [ref=f2e76]:
            - text: The concepts of
            - strong [ref=f2e77]: Previous Year
            - text: and
            - strong [ref=f2e78]: Assessment Year
            - text: are gone. There is now a single
            - strong [ref=f2e79]: Tax Year
            - text: ", running April to March."
          - list [ref=f2e80]:
            - listitem [ref=f2e81]: "Old phrasing: \"FY 2026-27, AY 2027-28\""
            - listitem [ref=f2e82]:
              - text: "New phrasing:"
              - strong [ref=f2e83]: "\"Tax Year 2026-27\""
