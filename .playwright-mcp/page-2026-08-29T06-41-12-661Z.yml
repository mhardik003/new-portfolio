          - paragraph [ref=f2e532]:
            - emphasis [ref=f2e533]: Sources differ on whether the standard deduction is counted inside these figures. Compute your own using the method above rather than relying on a published table.
          - heading "What ₹5.8 lakh of deductions actually requires" [level=3] [ref=f2e534]
          - paragraph [ref=f2e535]: "For a salaried engineer, the realistic maximum stack under the old regime:"
          - table [ref=f2e537]:
