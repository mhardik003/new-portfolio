          - heading "4.6 The break-even calculation" [level=2] [ref=f2e479]
          - paragraph [ref=f2e480]: The question is not which regime is "better"; it is whether your deductions exceed the point at which the old regime's higher rates are offset.
          - heading "Worked from first principles" [level=3] [ref=f2e481]
          - paragraph [ref=f2e482]:
            - text: Take a gross salary of
            - strong [ref=f2e483]: ₹16,36,710
            - text: .
          - paragraph [ref=f2e484]:
            - strong [ref=f2e485]: "Under the new regime:"
          - code [ref=f2e487]: "Gross ₹16,36,710 Less standard deduction ₹ 75,000 Total income ₹15,61,710 Tax: ₹4L–8L @ 5% = ₹ 20,000 ₹8L–12L @ 10% = ₹ 40,000 ₹12L–15.62L @ 15% = ₹ 54,257 ────────── ₹ 1,14,257 Cess @ 4% ₹ 4,570 ────────── Tax payable ₹ 1,18,827"
          - paragraph [ref=f2e488]:
            - strong [ref=f2e489]: To match this under the old regime
            - text: ", we need old-regime tax before cess of ₹1,14,257. Working backwards through the old slabs:"
          - code [ref=f2e491]: Tax of ₹1,12,500 is reached at total income of ₹10,00,000 Remaining ₹1,757 at 30% → ₹5,857 of further income Required total income = ₹10,05,857
          - paragraph [ref=f2e492]: "So total deductions must be:"
          - code [ref=f2e494]: ₹16,36,710 − ₹10,05,857 = ₹6,30,853
          - paragraph [ref=f2e495]:
            - strong [ref=f2e496]: Break-even ≈ ₹6.31 lakh of total deductions
            - text: ", of which ₹50,000 is the standard deduction, so"
            - strong [ref=f2e497]:
              - text: ₹5.81 lakh of
              - emphasis [ref=f2e498]: other
              - text: deductions
            - text: are needed before the old regime wins at this income level.
          - heading "Indicative break-even points" [level=3] [ref=f2e499]
          - paragraph [ref=f2e500]: "Published break-even estimates for AY 2026-27 across income levels:"
          - table [ref=f2e502]:
            - rowgroup [ref=f2e503]:
              - row [ref=f2e504]:
