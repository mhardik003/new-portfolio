          - paragraph [ref=f2e674]:
            - strong [ref=f2e675]: Advance tax matters for engineers with equity.
            - text: If your total tax liability after TDS exceeds ₹10,000 in a year (which a single RSU sale or a large capital gain can trigger), advance tax is due, and interest under the successors to Sections 234B and 234C accrues if it is not paid. Salary TDS does not cover capital gains.
