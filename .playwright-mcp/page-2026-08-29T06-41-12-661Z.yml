                - columnheader "With business or professional income" [ref=f2e584]
            - rowgroup [ref=f2e585]:
              - row [ref=f2e586]:
                - cell "Default" [ref=f2e587]
                - cell "New regime" [ref=f2e588]
                - cell "New regime" [ref=f2e589]
              - row [ref=f2e590]:
                - cell "Can you switch?" [ref=f2e591]
                - cell [ref=f2e592]:
                  - strong [ref=f2e593]: Yes, every year
                  - text: ", at the time of filing"
                - cell [ref=f2e594]:
                  - strong [ref=f2e595]: Once only.
                  - text: Having opted out of the new regime and returned to it, you cannot opt out again
              - row [ref=f2e596]:
                - cell "How" [ref=f2e597]
                - cell "Simply file under the chosen regime by the due date" [ref=f2e598]
                - cell "Form 10-IEA (under the old Act's numbering; the successor form under the 2025 Act)" [ref=f2e599]
          - paragraph [ref=f2e600]:
            - strong [ref=f2e601]: Your employer's declaration is not your final choice.
            - text: In January or February your employer will ask you to declare a regime so it can compute TDS. If your circumstances change, you can still file under the other regime and claim a refund or pay the balance. The declaration determines cash flow during the year, not your legal position.
          - paragraph [ref=f2e602]:
            - strong [ref=f2e603]: "A practical consequence:"
            - text: if you declare the new regime to your employer and later discover you had enough deductions for the old regime, you can still switch when filing. The reverse also holds. Excess TDS comes back as a refund.
          - separator [ref=f2e604]
