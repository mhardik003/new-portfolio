          - paragraph [ref=f2e572]:
            - strong [ref=f2e573]: "The pattern that emerges:"
            - text: the old regime generally wins only for people who simultaneously pay significant rent in a metro
            - emphasis [ref=f2e574]: and
            - text: have a home loan,
            - emphasis [ref=f2e575]: or
            - text: who carry large education loan interest. For an early-career engineer renting a flat with no home loan, the new regime usually wins, often by a wide margin.
          - separator [ref=f2e576]
          - heading "4.7 Choosing and switching" [level=2] [ref=f2e577]
          - table [ref=f2e579]:
            - rowgroup [ref=f2e580]:
