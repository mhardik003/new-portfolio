          - heading "14.1 What a financial plan is" [level=2] [ref=e178]
          - paragraph [ref=e179]:
            - text: "The CFP Board's definition:"
            - emphasis [ref=e180]: "\"the process of determining whether and how an individual can meet life goals through the proper management of financial resources.\""
          - paragraph [ref=e181]: "Its components:"
          - list [ref=e182]:
            - listitem [ref=e183]: Net worth
            - listitem [ref=e184]: Cash flow analysis
            - listitem [ref=e185]: Retirement strategy
            - listitem [ref=e186]: Risk and insurance
            - listitem [ref=e187]: Investment strategy
            - listitem [ref=e188]: Tax strategy
            - listitem [ref=e189]: Estate plan
          - paragraph [ref=e190]:
            - strong [ref=e191]: "Why it needs to be explicit:"
            - text: people spend more than they need to when they lack a specific reason to save. Short-term rewards compete against long-term payoffs, and the long-term payoff needs time to build. Writing the plan down measurably increases the likelihood of following it — and it becomes essential the moment more than one person is involved.
          - separator [ref=e192]
          - heading "14.2 Financial advice in India" [level=2] [ref=e193]
          - paragraph [ref=e194]:
            - text: The standard warning —
            - emphasis [ref=e195]: the term "financial advisor" can be used by anyone; be extremely wary
            - text: — applies with force in India, where the regulatory categories are distinct and the incentives differ sharply.
          - table [ref=e197]:
            - rowgroup [ref=e198]:
              - row [ref=e199]:
                - columnheader "Category" [ref=e200]
                - columnheader "Regulator" [ref=e201]
                - columnheader "How they are paid" [ref=e202]
                - columnheader "Duty owed" [ref=e203]
            - rowgroup [ref=e204]:
              - row [ref=e205]:
                - cell [ref=e206]:
                  - strong [ref=e207]: SEBI Registered Investment Adviser (RIA)
                - cell "SEBI" [ref=e208]
                - cell [ref=e209]:
                  - strong [ref=e210]: Fee-only
                  - text: ", paid by you. Prohibited from earning commission on products they advise on"
                - cell [ref=e211]:
                  - strong [ref=e212]: Fiduciary
              - row [ref=e213]:
                - cell [ref=e214]:
                  - strong [ref=e215]: SEBI Registered Portfolio Manager
                - cell "SEBI" [ref=e216]
                - cell "Fee on assets managed; minimum investment of ₹50 lakh" [ref=e217]
                - cell "Fiduciary within the mandate" [ref=e218]
              - row [ref=e219]:
                - cell [ref=e220]:
                  - strong [ref=e221]: Mutual Fund Distributor (ARN holder)
                - cell "AMFI / SEBI" [ref=e222]
                - cell [ref=e223]:
                  - strong [ref=e224]: Commission from the AMC
                  - text: ", embedded in the regular-plan expense ratio"
                - cell "Suitability, not fiduciary" [ref=e225]
              - row [ref=e226]:
                - cell [ref=e227]:
                  - strong [ref=e228]: Insurance agent / broker
                - cell "IRDAI" [ref=e229]
                - cell [ref=e230]:
                  - strong [ref=e231]: Commission from the insurer
                  - text: ", which is highest on the most expensive products"
                - cell "Suitability" [ref=e232]
              - row [ref=e233]:
                - cell [ref=e234]:
                  - strong [ref=e235]: Bank "relationship manager" / "wealth manager"
                - cell "Bank's own" [ref=e236]
                - cell "Salary plus internal sales targets on the bank's distributed products" [ref=e237]
                - cell "To the employer" [ref=e238]
          - paragraph [ref=e239]:
            - strong [ref=e240]: "Two things follow directly from that table:"
          - list [ref=e241]:
            - listitem [ref=e242]:
              - strong [ref=e243]: A "free" advisor is paid by someone.
              - text: If not by you, then by the product manufacturer, and the commission is highest on the products that cost you most — which is why endowment policies and ULIPs are sold far more often than term insurance.
            - listitem [ref=e244]:
              - strong [ref=e245]: Only a SEBI RIA is legally required to act in your interest
              - text: ", and only a fee-only RIA has no product-linked incentive."
              - strong [ref=e246]: CFP
              - text: and
              - strong [ref=e247]: CFA
              - text: are credentials, not regulatory registrations; a CFP may or may not be an RIA.
          - paragraph [ref=e248]: "There is countervailing evidence: advisors demonstrably help people avoid behavioural errors, with Vanguard estimating that value at around 150 basis points a year. That value is real. It is also entirely separable from product commission."
          - paragraph [ref=e249]:
            - strong [ref=e250]: Verify an RIA registration
            - text: on the SEBI website before engaging one.
          - separator [ref=e251]
          - heading "14.3 Projecting a goal" [level=2] [ref=e252]
          - paragraph [ref=e253]: "The mechanics are the same regardless of the goal:"
          - code [ref=e255]: 1. Define the target amount, in today's rupees 2. Inflate it to the target date 3. Choose a realistic return for that time horizon 4. Solve for the required monthly contribution
          - heading "Inflation assumptions for India" [level=3] [ref=e256]
          - table [ref=e258]:
            - rowgroup [ref=e259]:
              - row [ref=e260]:
                - columnheader "Category" [ref=e261]
                - columnheader "Approximate long-run inflation" [ref=e262]
            - rowgroup [ref=e263]:
              - row [ref=e264]:
                - cell "General (CPI)" [ref=e265]
                - cell [ref=e266]:
                  - text: RBI projects
                  - strong [ref=e267]: 5.0% for FY 2026-27
              - row [ref=e268]:
                - cell "Education" [ref=e269]
                - cell "Generally cited as running above general inflation" [ref=e270]
              - row [ref=e271]:
                - cell "Healthcare" [ref=e272]
                - cell "Consistently cited as running well above general inflation" [ref=e273]
              - row [ref=e274]:
                - cell "Property, metro" [ref=e275]
                - cell "Highly variable by city and micro-market" [ref=e276]
          - paragraph [ref=e277]: Use general CPI for undifferentiated spending, and higher figures for education and healthcare specifically.
          - heading "Return assumptions by horizon" [level=3] [ref=e278]
          - paragraph [ref=e279]: "The horizon should determine the asset, not the reverse:"
          - table [ref=e281]:
            - rowgroup [ref=e282]:
              - row [ref=e283]:
                - columnheader "Horizon" [ref=e284]
                - columnheader "Character of the goal" [ref=e285]
                - columnheader "Where the money can sit" [ref=e286]
            - rowgroup [ref=e287]:
              - row [ref=e288]:
                - cell [ref=e289]:
                  - strong [ref=e290]: Under 1 year
                - cell "Emergency fund, insurance premiums, a planned trip" [ref=e291]
                - cell "Savings, sweep-in FD, liquid fund" [ref=e292]
              - row [ref=e293]:
                - cell [ref=e294]:
                  - strong [ref=e295]: 1–3 years
                - cell "Car, wedding, house down payment near-term" [ref=e296]
                - cell "FD, short-duration debt, arbitrage funds" [ref=e297]
              - row [ref=e298]:
                - cell [ref=e299]:
                  - strong [ref=e300]: 3–7 years
                - cell "House down payment, higher education" [ref=e301]
                - cell "Hybrid; a modest equity component" [ref=e302]
              - row [ref=e303]:
                - cell [ref=e304]:
                  - strong [ref=e305]: 7+ years
                - cell "Children's education, retirement" [ref=e306]
                - cell "Equity-dominated" [ref=e307]
          - paragraph [ref=e308]:
            - strong [ref=e309]: "The rule underlying this:"
            - text: money you will need on a fixed date within three years should not be exposed to equity, because the historical record shows multi-year negative periods. Money you will not need for a decade should not sit in cash, because inflation is a certainty and volatility is not a loss until you sell.
          - heading "The formula" [level=3] [ref=e310]
          - code [ref=e312]: FV × i Monthly SIP = ───────────────────── ((1+i)^n − 1) × (1+i)
          - paragraph [ref=e313]:
            - text: where
            - code [ref=e314]: i
            - text: is the monthly return and
            - code [ref=e315]: "n"
            - text: the number of months.
            - code [ref=e316]: PMT()
            - text: in a spreadsheet.
          - paragraph [ref=e317]:
            - strong [ref=e318]: "Worked:"
            - text: a ₹40 lakh target in 10 years at 12% requires roughly
            - strong [ref=e319]: ₹17,400 a month
            - text: . The same target in 5 years requires roughly
            - strong [ref=e320]: ₹48,800 a month
            - text: — because compounding has had less time to do the work, so contributions must do more of it.
          - separator [ref=e321]
          - heading "14.4 The common goals" [level=2] [ref=e322]
          - heading "Emergency fund" [level=3] [ref=e323]
          - paragraph [ref=e324]:
            - text: Covered in
            - link "§1.5" [ref=e325] [cursor=pointer]:
              - /url: /articles/personal-finance-india/first-principles
            - text: . 3–6 months of expenses, liquid and safe, first to fill and first to refill.
          - heading "Wedding" [level=3] [ref=e326]
          - paragraph [ref=e327]:
            - text: Frequently the largest discretionary outflow in an Indian engineer's twenties or thirties, often part-funded by family, and almost always on a known date. That makes it a
            - strong [ref=e328]: short-to-medium-term goal with a hard deadline
            - text: — which rules out equity in the final couple of years. The most common error is running the wedding fund in equity until three months before.
          - heading "Car" [level=3] [ref=e329]
          - paragraph [ref=e330]:
            - text: A
            - strong [ref=e331]: depreciating asset
            - text: . It belongs on the balance sheet at falling value, and the total cost of ownership — insurance, fuel, maintenance, parking — typically exceeds the EMI over the holding period.
          - heading "Supporting parents" [level=3] [ref=e332]
          - paragraph [ref=e333]:
            - text: Recurring transfers to parents are a standard feature of Indian household finance and are absent from Western templates. They belong in the budget as a
            - strong [ref=e334]: fixed line
            - text: ", and their likely growth — particularly healthcare — belongs in long-term projections. Health insurance for parents is addressed in"
            - link "§9.5" [ref=e335] [cursor=pointer]:
              - /url: /articles/personal-finance-india/insurance
            - text: .
          - heading "Children's education" [level=3] [ref=e336]
          - paragraph [ref=e337]:
            - text: "The pattern is consistent across countries: education costs have risen faster than general inflation, and"
            - strong [ref=e338]: the time frame is short
            - text: . You have 40–50 years to fund retirement; you have 18 for a child's undergraduate degree, which is not long enough for compounding to do most of the work.
          - paragraph [ref=e339]:
            - text: India has no equivalent of the US 529 plan. The available vehicles are the ordinary ones — equity mutual funds for the long horizon, plus
            - strong [ref=e340]: SSY at 8.2% EEE
            - text: for a girl child, which is the only education-linked instrument with a tax advantage.
          - heading "Retirement" [level=3] [ref=e341]
          - paragraph [ref=e342]: "It decomposes into four interrelated problems: projecting income over 40+ years, replacing income for 30+ years, tax efficiency, and planning for more than one person."
          - paragraph [ref=e343]:
            - strong [ref=e344]: The 4% rule
            - text: "— withdrawing 4% of the initial corpus in year one and adjusting for inflation thereafter — is the standard first approximation. It derives from US historical data on a US portfolio with US inflation. Applying it to India requires stating the differences:"
          - list [ref=e345]:
            - listitem [ref=e346]:
              - strong [ref=e347]: Inflation has been structurally higher in India
              - text: than in the US over the relevant history.
            - listitem [ref=e348]:
              - strong [ref=e349]: The Indian equity data series is much shorter
              - text: ", so the statistical confidence is correspondingly lower."
            - listitem [ref=e350]:
              - strong [ref=e351]: There is no universal state pension.
              - text: EPS pays a few thousand rupees a month (see
              - link "§7.9" [ref=e352] [cursor=pointer]:
                - /url: /articles/personal-finance-india/epf-eps-form-11
              - text: ). There is no Social Security equivalent.
            - listitem [ref=e353]:
              - strong [ref=e354]: Healthcare costs in retirement are borne privately
              - text: ", and health insurance premiums rise steeply with age."
          - paragraph [ref=e355]: "The 4% rule is therefore a starting point for the arithmetic, not a conclusion. The underlying identity is unchanged and is worth stating plainly:"
          - code [ref=e357]: Corpus required = annual expenses in retirement ÷ safe withdrawal rate
          - paragraph [ref=e358]:
            - text: At 4%, that is 25× annual expenses. At 3.5%, roughly 29×.
            - strong [ref=e359]: The single largest lever is not the withdrawal rate — it is the annual expense figure
            - text: ", which is why savings rate helps twice (see"
            - link "§1.3" [ref=e360] [cursor=pointer]:
              - /url: /articles/personal-finance-india/first-principles
            - text: ).
          - paragraph [ref=e361]:
            - strong [ref=e362]: Asset location
            - text: "matters alongside asset allocation: which instruments to hold in tax-exempt wrappers (EPF, PPF), which in tax-deferred ones (NPS), and which in taxable accounts."
          - separator [ref=e363]
          - heading "14.5 Real estate — the decision" [level=2] [ref=e364]
          - paragraph [ref=e365]: The largest financial commitment most Indian households make, with the highest transaction costs and the strongest emotions attached.
          - heading "Why people buy" [level=3] [ref=e366]
          - list [ref=e367]:
            - listitem [ref=e368]: They need somewhere to live
            - listitem [ref=e369]: They want control over where they live for a long period
            - listitem [ref=e370]: Emotional attachment to ownership — in India, frequently reinforced by family expectation
            - listitem [ref=e371]: They believe it is a good investment
          - heading "Why people rent" [level=3] [ref=e372]
          - list [ref=e373]:
            - listitem [ref=e374]: Flexibility of location
            - listitem [ref=e375]: Reluctance to make a long-term financial and geographic commitment
            - listitem [ref=e376]: Insufficient capital for a down payment
            - listitem [ref=e377]: Simpler cash flow management
          - separator [ref=e378]
          - heading "14.6 The costs of buying in India" [level=2] [ref=e379]
          - heading "At purchase" [level=3] [ref=e380]
          - table [ref=e382]:
            - rowgroup [ref=e383]:
              - row [ref=e384]:
                - columnheader "Cost" [ref=e385]
                - columnheader "Typical" [ref=e386]
            - rowgroup [ref=e387]:
              - row [ref=e388]:
                - cell [ref=e389]:
                  - strong [ref=e390]: Down payment
                - cell "10%–25% (see LTV limits below)" [ref=e391]
              - row [ref=e392]:
                - cell [ref=e393]:
                  - strong [ref=e394]: Stamp duty
                - cell [ref=e395]:
                  - strong [ref=e396]: 5%–7% of the agreement value
                  - text: ", varies by state; several states offer a concession for women buyers"
              - row [ref=e397]:
                - cell [ref=e398]:
                  - strong [ref=e399]: Registration charge
                - cell "~1%" [ref=e400]
              - row [ref=e401]:
                - cell [ref=e402]:
                  - strong [ref=e403]: GST — under-construction
                - cell [ref=e404]:
                  - strong [ref=e405]: 5%
                  - text: (1% for affordable housing)
              - row [ref=e406]:
                - cell [ref=e407]:
                  - strong [ref=e408]: GST — ready-to-move with completion certificate
                - cell [ref=e409]:
                  - strong [ref=e410]: Nil
              - row [ref=e411]:
                - cell [ref=e412]:
                  - strong [ref=e413]: Brokerage
                - cell "1%–2%, where a broker is involved" [ref=e414]
              - row [ref=e415]:
                - cell [ref=e416]:
                  - strong [ref=e417]: Legal and technical due diligence
                - cell "₹15,000–₹50,000" [ref=e418]
              - row [ref=e419]:
                - cell [ref=e420]:
                  - strong [ref=e421]: Home loan processing fee
                - cell "0.25%–1% of the loan" [ref=e422]
          - paragraph [ref=e423]:
            - strong [ref=e424]: Stamp duty and registration alone run to 6%–8% of the property value
            - text: ", and are payable in cash on top of the down payment. This is the most consistently underestimated line in an Indian property purchase."
          - heading "Ongoing" [level=3] [ref=e425]
          - table [ref=e427]:
            - rowgroup [ref=e428]:
              - row [ref=e429]:
                - columnheader "Cost" [ref=e430]
                - columnheader "Typical" [ref=e431]
            - rowgroup [ref=e432]:
              - row [ref=e433]:
                - cell "Property tax" [ref=e434]
                - cell "Municipal, varies widely; generally modest relative to the US" [ref=e435]
              - row [ref=e436]:
                - cell [ref=e437]:
                  - strong [ref=e438]: Society maintenance / CAM
                - cell "₹2–₹6 per sq ft per month in metros — for a 1,200 sq ft flat, ₹2,400–₹7,200 a month" [ref=e439]
              - row [ref=e440]:
