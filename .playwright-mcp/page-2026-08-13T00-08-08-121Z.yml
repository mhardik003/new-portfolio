          - heading "14.7 Home loan eligibility" [level=2] [ref=e471]
          - paragraph [ref=e472]: "Banks assess two things:"
          - list [ref=e473]:
            - listitem [ref=e474]:
              - strong [ref=e475]: Do you have the down payment?
              - text: — the asset test
            - listitem [ref=e476]:
              - strong [ref=e477]: Will your income cover the EMI?
              - text: — the cash flow test
          - heading "Loan-to-value limits" [level=3] [ref=e478]
          - paragraph [ref=e479]: "RBI norms cap LTV by loan size:"
          - table [ref=e481]:
            - rowgroup [ref=e482]:
              - row [ref=e483]:
                - columnheader "Property value" [ref=e484]
                - columnheader "Maximum LTV" [ref=e485]
                - columnheader "Minimum down payment" [ref=e486]
            - rowgroup [ref=e487]:
              - row [ref=e488]:
                - cell "Up to ₹30 lakh" [ref=e489]
                - cell "90%" [ref=e490]
                - cell "10%" [ref=e491]
              - row [ref=e492]:
                - cell "₹30–75 lakh" [ref=e493]
                - cell "80%" [ref=e494]
                - cell "20%" [ref=e495]
              - row [ref=e496]:
                - cell "Above ₹75 lakh" [ref=e497]
                - cell "75%" [ref=e498]
                - cell "25%" [ref=e499]
          - paragraph [ref=e500]:
            - strong [ref=e501]: Stamp duty and registration are excluded from the property value for LTV purposes
            - text: ", so they must be funded entirely from your own capital."
          - heading "FOIR" [level=3] [ref=e502]
          - paragraph [ref=e503]:
            - text: Lenders apply a
            - strong [ref=e504]: Fixed Obligation to Income Ratio
            - text: — total EMIs, including the proposed one, as a proportion of net monthly income. Typical ceilings are
            - strong [ref=e505]: 50%–60%
            - text: ", tightening at lower incomes and loosening at higher ones. Existing EMIs, including a car loan and any credit card minimum, reduce the amount you can borrow."
          - paragraph [ref=e506]:
            - text: Your
            - strong [ref=e507]: credit score directly determines your rate.
            - text: Lenders reserve their best pricing — currently around 7.25%–7.50% — for applicants scoring 750 or above.
          - paragraph [ref=e508]:
            - strong [ref=e509]: Shop within a short window.
            - text: Multiple loan applications generate multiple hard enquiries; concentrating them into a two-week period limits the impact on your score.
          - separator [ref=e510]
          - heading "14.8 Property and tax" [level=2] [ref=e511]
          - heading "While you own" [level=3] [ref=e512]
          - table [ref=e514]:
            - rowgroup [ref=e515]:
              - row [ref=e516]:
                - columnheader "Situation" [ref=e517]
                - columnheader "Old regime" [ref=e518]
                - columnheader "New regime" [ref=e519]
            - rowgroup [ref=e520]:
              - row [ref=e521]:
                - cell "Self-occupied — interest under Section 22 (formerly 24(b))" [ref=e522]
