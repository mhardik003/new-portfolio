                - cell [ref=e524]:
                  - strong [ref=e525]: Not available
              - row [ref=e526]:
                - cell "Self-occupied — principal under Section 123 (formerly 80C)" [ref=e527]
                - cell "Within ₹1,50,000" [ref=e528]
                - cell [ref=e529]:
                  - strong [ref=e530]: Not available
              - row [ref=e531]:
                - cell "Let out — interest" [ref=e532]
                - cell [ref=e533]:
                  - strong [ref=e534]: No limit
                  - text: ; loss set-off against other income capped at ₹2,00,000/yr
                - cell "Same" [ref=e535]
              - row [ref=e536]:
                - cell "Let out — standard deduction on rental income" [ref=e537]
                - cell "30% of net annual value" [ref=e538]
                - cell "Same" [ref=e539]
          - paragraph [ref=e540]:
            - strong [ref=e541]: Rental income
            - text: is taxable after municipal taxes paid and the 30% standard deduction.
          - heading "When you sell" [level=3] [ref=e542]
          - table [ref=e544]:
            - rowgroup [ref=e545]:
              - row [ref=e546]:
                - columnheader "Holding period" [ref=e547]
                - columnheader "Treatment" [ref=e548]
            - rowgroup [ref=e549]:
              - row [ref=e550]:
                - cell [ref=e551]:
                  - strong [ref=e552]: Up to 24 months
                - cell [ref=e553]:
                  - text: Short-term capital gain, taxed at
                  - strong [ref=e554]: slab rate
              - row [ref=e555]:
                - cell [ref=e556]:
                  - strong [ref=e557]: Over 24 months
                - cell [ref=e558]:
                  - text: Long-term capital gain, taxed at
                  - strong [ref=e559]: 12.5% without indexation
          - paragraph [ref=e560]:
            - strong [ref=e561]: "Grandfathering:"
            - text: for land or buildings acquired
            - strong [ref=e562]: before 23 July 2024
            - text: ", a resident individual or HUF may compute tax as the"
            - strong [ref=e563]: lower of
            - text: 12.5% without indexation and 20% with indexation.
          - paragraph [ref=e564]:
            - strong [ref=e565]: "Exemptions on reinvestment:"
          - table [ref=e567]:
            - rowgroup [ref=e568]:
              - row [ref=e569]:
                - columnheader "Provision" [ref=e570]
                - columnheader "What it allows" [ref=e571]
            - rowgroup [ref=e572]:
              - row [ref=e573]:
                - cell [ref=e574]:
                  - strong [ref=e575]: Section 54
                  - text: (formerly)
                - cell "LTCG on a residential house reinvested in another residential house — purchase within 1 year before or 2 years after, or construction within 3 years. Capped at ₹10 crore" [ref=e576]
              - row [ref=e577]:
                - cell [ref=e578]:
                  - strong [ref=e579]: Section 54F
                  - text: (formerly)
                - cell [ref=e580]:
                  - text: LTCG on
                  - strong [ref=e581]: any other
                  - text: long-term asset reinvested in a residential house, subject to conditions on other property owned
              - row [ref=e582]:
                - cell [ref=e583]:
                  - strong [ref=e584]: Section 54EC
                  - text: (formerly)
                - cell [ref=e585]:
                  - text: LTCG on land or building invested in specified bonds (NHAI, REC, PFC, IRFC) within 6 months.
                  - strong [ref=e586]: Capped at ₹50 lakh
                  - text: ", 5-year lock-in"
              - row [ref=e587]:
                - cell [ref=e588]:
                  - strong [ref=e589]: Capital Gains Account Scheme
                - cell "Where reinvestment has not occurred by the return filing date, park the gain in a designated bank account to preserve the exemption" [ref=e590]
          - separator [ref=e591]
          - heading "14.9 Rent versus buy, with Indian numbers" [level=2] [ref=e592]
          - paragraph [ref=e593]:
            - text: The financial comparison turns on
            - strong [ref=e594]: rental yield
            - text: — annual rent as a percentage of property value — and its inverse, the
            - strong [ref=e595]: price-to-rent ratio
            - text: .
          - heading "Gross rental yields, Q2 2026" [level=3] [ref=e596]
          - table [ref=e598]:
            - rowgroup [ref=e599]:
              - row [ref=e600]:
                - columnheader "City" [ref=e601]
                - columnheader "Gross yield" [ref=e602]
                - columnheader "Price-to-rent" [ref=e603]
            - rowgroup [ref=e604]:
              - row [ref=e605]:
                - cell [ref=e606]:
                  - strong [ref=e607]: Hyderabad
                - cell "5.5%" [ref=e608]
                - cell "~18×" [ref=e609]
              - row [ref=e610]:
                - cell [ref=e611]:
                  - strong [ref=e612]: Pune
                - cell "4.35%" [ref=e613]
                - cell "~23×" [ref=e614]
              - row [ref=e615]:
                - cell [ref=e616]:
                  - strong [ref=e617]: Mumbai
                - cell "4.15% (prime areas 2.5%–3.0%)" [ref=e618]
                - cell "~24× (prime 33×+)" [ref=e619]
              - row [ref=e620]:
                - cell [ref=e621]:
                  - strong [ref=e622]: Bengaluru
                - cell "3.6%" [ref=e623]
                - cell "~28×" [ref=e624]
              - row [ref=e625]:
                - cell [ref=e626]:
                  - strong [ref=e627]: Delhi NCR
                - cell "3.2%" [ref=e628]
                - cell "~31×" [ref=e629]
              - row [ref=e630]:
                - cell [ref=e631]:
                  - strong [ref=e632]: National average
                - cell [ref=e633]:
                  - strong [ref=e634]: 5.16%
                - cell "~19×" [ref=e635]
          - heading "What the numbers imply" [level=3] [ref=e636]
          - paragraph [ref=e637]: "Compare the rental yield against the mortgage rate and against alternative returns:"
          - code [ref=e639]: Home loan rate ~7.25% – 8.50% Gross rental yield, major tech cities 3.2% – 5.5% Net rental yield (after maintenance, property tax, vacancy) roughly 1–2 percentage points lower
          - paragraph [ref=e640]:
            - strong [ref=e641]: In Bengaluru, Delhi NCR and prime Mumbai, the cost of borrowing exceeds the gross rental yield by a wide margin.
            - text: The purchase is therefore financed by expected capital appreciation, not by the property's income. That may prove correct; it is a distinct bet from "renting is throwing money away."
          - paragraph [ref=e642]:
            - text: "A common framing:"
            - strong [ref=e643]: below roughly 4% yield (above ~25× price-to-rent), renting and investing the difference has historically built more wealth; above roughly 5% yield (below ~20×), buying becomes financially competitive.
            - text: That is a heuristic, not a law, and it is silent on everything non-financial.
          - heading "The financial case for renting" [level=3] [ref=e644]
          - list [ref=e645]:
            - listitem [ref=e646]:
              - strong [ref=e647]: Liquidity
              - text: — capital is not locked in a down payment and forced principal repayments
            - listitem [ref=e648]:
              - strong [ref=e649]: Location flexibility
              - text: — a fixed location can materially constrain career options in a country where tech employment concentrates in a handful of cities
            - listitem [ref=e650]:
              - strong [ref=e651]: Diversification
              - text: — a house is typically 5–15× annual income concentrated in one asset, one city, one micro-market
            - listitem [ref=e652]:
              - strong [ref=e653]: No geographic market risk
              - text: — some Indian micro-markets have appreciated enormously; others have been flat for a decade
            - listitem [ref=e654]:
              - strong [ref=e655]: Maintenance is the owner's problem
            - listitem [ref=e656]:
              - strong [ref=e657]: Competitive market
              - text: — rents broadly track wage inflation, with competition between landlords
          - heading "The financial case for owning" [level=3] [ref=e658]
          - list [ref=e659]:
            - listitem [ref=e660]:
              - strong [ref=e661]: Leverage
              - text: — most of the investment is made with a loan at 5×–10× leverage, and the gains accrue to you, not the bank
            - listitem [ref=e662]:
              - strong [ref=e663]: Forced saving
              - text: — the down payment cannot easily be spent, and principal repayment is a monthly savings commitment.
              - strong [ref=e664]: this, rather than appreciation, is the primary reason real estate builds wealth for most people
            - listitem [ref=e665]:
              - strong [ref=e666]: Tax advantages
              - text: — Section 22 and Section 123, in the old regime
            - listitem [ref=e667]:
              - strong [ref=e668]: Long-run positive real return
              - text: ", with lower volatility than equities across most long-run studies"
            - listitem [ref=e669]:
              - strong [ref=e670]: Control
              - text: — you decide what to improve and when
            - listitem [ref=e671]:
              - strong [ref=e672]: Optional rental income
              - text: later, which rises with inflation
            - listitem [ref=e673]:
              - strong [ref=e674]: Long holding periods
              - text: — people hold homes far longer than they hold financial assets, which gives compounding more time and removes the temptation to trade
          - heading "The non-financial factors" [level=3] [ref=e675]
          - paragraph [ref=e676]: "These frequently dominate the financial arithmetic: high transaction costs make short holding periods risky; a fixed location limits career opportunity; community and schools matter; for most people it is the single largest investment they will make; and many people hold strong beliefs about it that are not financial in origin."
          - paragraph [ref=e677]:
            - text: In India, add
            - strong [ref=e678]: family expectation
            - text: ", which is a real input into the decision even though it does not appear in any spreadsheet."
          - separator [ref=e679]
          - heading "14.10 Rental property as an investment" [level=2] [ref=e680]
          - code [ref=e682]: Capitalisation rate = net operating income ÷ market value
          - paragraph [ref=e683]:
            - strong [ref=e684]: "Why people are drawn to it:"
            - text: most fixed costs are incurred up front while rental income rises with inflation; paying off the mortgage leaves an asset producing inflation-adjusted income; it is tangible and comprehensible in a way that financial markets are not; and it carries some of the psychological satisfactions of owning a business.
          - paragraph [ref=e685]:
            - strong [ref=e686]: "What it actually involves:"
          - list [ref=e687]:
            - listitem [ref=e688]:
              - strong [ref=e689]: Time.
              - text: It is a second job, with unpredictable demands.
            - listitem [ref=e690]:
              - strong [ref=e691]: Cash flow.
              - text: It is easy to own something profitable over twenty years and cash-flow negative for the first five.
            - listitem [ref=e692]:
              - strong [ref=e693]: Vacancy.
              - text: Expensive and unpredictable.
            - listitem [ref=e694]:
              - strong [ref=e695]: Tenants.
              - text: Finding them, managing them, replacing them.
            - listitem [ref=e696]:
              - strong [ref=e697]: Legal exposure.
              - text: Tenancy law varies by state; eviction can be slow and expensive. India's Model Tenancy Act, 2021 has been adopted by only some states.
          - paragraph [ref=e698]: "Tax treatment is more business-like: rental income less municipal taxes less a 30% standard deduction, plus full interest deduction, with the set-off of house property loss against other income capped at ₹2 lakh a year."
          - paragraph [ref=e699]:
            - strong [ref=e700]: REITs
            - text: offer exposure to commercial real estate through a listed, liquid instrument. Several are listed in India. Distributions have a mixed tax character depending on the component (interest, dividend, or return of capital), which makes their taxation more complex than that of equity.
          - separator [ref=e701]
          - heading "14.11 Planning with a partner" [level=2] [ref=e702]
          - paragraph [ref=e703]: Financial planning is hard alone and considerably harder jointly, because two people bring different timelines, priorities and possibilities. Money is among the most commonly cited sources of relationship breakdown.
          - heading "Account structures" [level=3] [ref=e704]
          - paragraph [ref=e705]: "Three structures are common, and none of them solves the underlying problem:"
          - table [ref=e707]:
            - rowgroup [ref=e708]:
              - row [ref=e709]:
                - columnheader "Structure" [ref=e710]
                - columnheader "How it works" [ref=e711]
            - rowgroup [ref=e712]:
              - row [ref=e713]:
                - cell [ref=e714]:
                  - strong [ref=e715]: One account
                - cell "Fully shared" [ref=e716]
              - row [ref=e717]:
                - cell [ref=e718]:
                  - strong [ref=e719]: Two accounts
                - cell "Separate, with coordination on bill payment" [ref=e720]
              - row [ref=e721]:
                - cell [ref=e722]:
                  - strong [ref=e723]: Three accounts
                - cell "Two personal plus one joint for shared expenses" [ref=e724]
          - paragraph [ref=e725]:
            - strong [ref=e726]: The core issue is communication and values, not account architecture.
            - text: "A useful convention that costs nothing: agree a rupee threshold above which any expenditure is discussed first."
          - heading "What stays individual in India" [level=3] [ref=e727]
          - list [ref=e728]:
            - listitem [ref=e729]:
              - strong [ref=e730]: EPF, EPS and NPS accounts are individual.
              - text: They cannot be jointly held.
            - listitem [ref=e731]:
              - strong [ref=e732]: Equity compensation is individual.
            - listitem [ref=e733]:
              - strong [ref=e734]: PPF accounts are individual
              - text: ", and the ₹1.5 lakh annual limit applies per individual — a couple can hold two."
            - listitem [ref=e735]:
              - text: Bank accounts, demat accounts and mutual fund folios
              - strong [ref=e736]: can
              - text: be joint.
          - heading "Joint liability" [level=3] [ref=e737]
          - paragraph [ref=e738]:
            - strong [ref=e739]: Being a co-borrower on a loan means joint and several liability for the whole amount
            - text: ", not half of it. Co-signing for anyone — spouse, parent, sibling, friend — makes their default your default, and their missed payment appears on your credit report."
          - paragraph [ref=e740]:
            - text: Where a couple co-owns and co-borrows on a home loan,
            - strong [ref=e741]: each may claim the full Section 22 and Section 123 limits independently
            - text: ", which is one of the few genuine tax advantages of joint ownership."
          - heading "Clubbing of income" [level=3] [ref=e742]
          - paragraph [ref=e743]:
            - text: Income from assets you
            - strong [ref=e744]: gift
            - text: to your spouse, or to a minor child, is generally
            - strong [ref=e745]: clubbed back into your income
            - text: for tax purposes. Transferring investments to a lower-earning spouse does not shift the tax liability. Assets given to a
            - strong [ref=e746]: major child
            - text: or to parents are not subject to clubbing.
          - separator [ref=e747]
          - heading "14.12 Nomination is not inheritance" [level=2] [ref=e748]
          - paragraph [ref=e749]: The most consequential misunderstanding in Indian personal finance, and one that only surfaces at the worst possible moment.
          - blockquote [ref=e750]:
            - paragraph [ref=e751]:
              - strong [ref=e752]: A nominee is a trustee, not an owner.
          - paragraph [ref=e753]:
            - text: A nomination determines
            - strong [ref=e754]: who the institution may pay
            - text: . It does not determine
            - strong [ref=e755]: who is legally entitled to keep
            - text: the money. The nominee receives the asset and holds it for the legal heirs as determined by succession law or by a will.
          - paragraph [ref=e756]: There are limited statutory exceptions — notably for certain insurance nominations to specified close relatives, and for shares under the Companies Act — where the nominee's position is stronger. The general rule holds for bank accounts, mutual funds, EPF and most other assets.
          - heading "What follows" [level=3] [ref=e757]
          - table [ref=e759]:
            - rowgroup [ref=e760]:
              - row [ref=e761]:
                - columnheader "Asset" [ref=e762]
                - columnheader "Nominate where?" [ref=e763]
            - rowgroup [ref=e764]:
              - row [ref=e765]:
                - cell "Bank accounts" [ref=e766]
                - cell "Each bank" [ref=e767]
              - row [ref=e768]:
                - cell "Fixed deposits" [ref=e769]
                - cell "Each deposit" [ref=e770]
              - row [ref=e771]:
                - cell [ref=e772]:
                  - strong [ref=e773]: EPF, EPS, EDLI
                - cell "EPFO e-nomination — covers all three" [ref=e774]
              - row [ref=e775]:
                - cell [ref=e776]:
                  - strong [ref=e777]: NPS
                - cell "On the PRAN" [ref=e778]
              - row [ref=e779]:
                - cell "Mutual funds" [ref=e780]
                - cell "Each folio, or across folios via the registrar" [ref=e781]
              - row [ref=e782]:
                - cell "Demat account" [ref=e783]
                - cell "With the depository participant" [ref=e784]
              - row [ref=e785]:
                - cell "Insurance policies" [ref=e786]
                - cell "Each policy" [ref=e787]
              - row [ref=e788]:
                - cell "PPF" [ref=e789]
                - cell "At the post office or bank" [ref=e790]
          - heading "Succession without a will" [level=3] [ref=e791]
          - paragraph [ref=e792]: "If you die intestate, distribution follows statute:"
          - list [ref=e793]:
            - listitem [ref=e794]:
              - strong [ref=e795]: Hindus, Buddhists, Jains, Sikhs
              - text: — the Hindu Succession Act, 1956
            - listitem [ref=e796]:
              - strong [ref=e797]: Muslims
              - text: — personal law
            - listitem [ref=e798]:
              - strong [ref=e799]: Christians, Parsis and others
              - text: — the Indian Succession Act, 1925
            - listitem [ref=e800]:
              - strong [ref=e801]: Anyone
              - text: who married under the Special Marriage Act, 1954 — the Indian Succession Act
          - paragraph [ref=e802]: These outcomes may differ substantially from what you would have chosen.
          - heading "A will" [level=3] [ref=e803]
          - list [ref=e804]:
            - listitem [ref=e805]:
              - text: Must be in writing, signed by you, and attested by
              - strong [ref=e806]: two witnesses
              - text: who are not beneficiaries.
            - listitem [ref=e807]:
              - strong [ref=e808]: Registration is optional
              - text: in India, but registering it reduces the scope for later dispute.
            - listitem [ref=e809]: Can be changed or revoked at any time while you are of sound mind.
            - listitem [ref=e810]:
              - strong [ref=e811]: Probate
              - text: is required in certain jurisdictions and circumstances.
          - paragraph [ref=e812]: A simple will costs very little and resolves an enormous amount. Most Indian engineers do not have one, and the most common reason given — "I do not have enough assets to need one" — is usually already untrue by the time it is said, once EPF, NPS, equity and a flat are counted.
          - separator [ref=e813]
          - heading "14.13 Checklist" [level=2] [ref=e814]
          - list [ref=e815]:
            - listitem [ref=e816]:
              - checkbox [disabled] [ref=e817]
              - text: Write down each goal with a
              - strong [ref=e818]: target amount and a date
            - listitem [ref=e819]:
              - checkbox [disabled] [ref=e820]
              - text: Match the
              - strong [ref=e821]: asset to the horizon
              - text: — nothing needed within three years should sit in equity
            - listitem [ref=e822]:
              - checkbox [disabled] [ref=e823]
              - text: Verify any advisor's
              - strong [ref=e824]: SEBI RIA registration
              - text: ", and establish who pays them"
            - listitem [ref=e825]:
              - checkbox [disabled] [ref=e826]
              - text: If comparing rent versus buy, compute the
              - strong [ref=e827]: rental yield
              - text: for your specific micro-market, not the city average
            - listitem [ref=e828]:
              - checkbox [disabled] [ref=e829]
              - text: Include
              - strong [ref=e830]: stamp duty, registration and GST
              - text: in any purchase calculation — 6%–8% before you begin
            - listitem [ref=e831]:
              - checkbox [disabled] [ref=e832]
              - text: Note that a self-occupied home loan carries
              - strong [ref=e833]: no tax benefit in the new regime
            - listitem [ref=e834]:
              - checkbox [disabled] [ref=e835]
              - text: File a
              - strong [ref=e836]: nomination
              - text: on every account, policy, folio, PRAN and EPF record
            - listitem [ref=e837]:
              - checkbox [disabled] [ref=e838]
              - text: Understand that a
              - strong [ref=e839]: nominee is a trustee, not an heir
            - listitem [ref=e840]:
              - checkbox [disabled] [ref=e841]
              - strong [ref=e842]: Write a will
            - listitem [ref=e843]:
              - checkbox [disabled] [ref=e844]
              - text: If you have a partner, agree the
              - strong [ref=e845]: threshold above which expenditure is discussed
